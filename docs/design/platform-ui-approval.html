<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Assurance — UI Design Approval</title>
  <style>
    :root {
      color-scheme: light;
      --ink-950: #101114;
      --ink-800: #25272c;
      --ink-650: #50545d;
      --ink-500: #747983;
      --ink-350: #a4a8b0;
      --line: #e6e7e9;
      --line-strong: #d7d9dd;
      --canvas: #f6f7f8;
      --panel: #ffffff;
      --panel-soft: #f1f2f4;
      --hover: #eceef0;
      --accent: #087f5b;
      --accent-dark: #056849;
      --accent-soft: #e8f7f1;
      --blue: #2563eb;
      --blue-soft: #edf4ff;
      --amber: #a15c00;
      --amber-soft: #fff6df;
      --red: #b42318;
      --red-soft: #fff0ee;
      --purple: #6d45b5;
      --purple-soft: #f3effb;
      --shadow-float: 0 18px 54px rgba(16, 17, 20, .12), 0 1px 2px rgba(16, 17, 20, .08);
      --radius: 14px;
      --radius-sm: 9px;
      --rail: 252px;
      --topbar: 60px;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink-950);
      font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .icon { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .icon.sm { width: 15px; height: 15px; }
    .icon.lg { width: 22px; height: 22px; }
    .sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

    .app { display: grid; grid-template-columns: var(--rail) 1fr; height: 100vh; }
    .sidebar {
      display: flex;
      min-width: 0;
      flex-direction: column;
      border-right: 1px solid var(--line);
      background: rgba(255, 255, 255, .96);
    }
    .brand { padding: 20px 18px 13px; }
    .brand-row { display: flex; align-items: center; gap: 10px; }
    .brand-mark {
      display: grid; width: 32px; height: 32px; place-items: center;
      border-radius: 10px; background: var(--ink-950); color: white;
    }
    .brand-name { font-size: 14px; font-weight: 700; letter-spacing: -.01em; }
    .brand-caption { color: var(--ink-500); font-size: 11px; }
    .prototype-label {
      display: inline-flex; align-items: center; gap: 6px; margin-top: 13px;
      border: 1px solid var(--line); border-radius: 999px; padding: 3px 8px;
      color: var(--ink-650); background: var(--canvas); font-size: 10px; font-weight: 650;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .prototype-label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
    .navigation { flex: 1; overflow-y: auto; padding: 3px 10px 16px; }
    .nav-group { margin-top: 12px; }
    .nav-label { padding: 0 9px 5px; color: var(--ink-350); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
    .nav-item {
      display: flex; width: 100%; align-items: center; gap: 10px; border: 0;
      border-radius: 8px; background: transparent; padding: 7px 9px; cursor: pointer;
      color: var(--ink-650); text-align: left; transition: background 140ms ease, color 140ms ease;
    }
    .nav-item:hover { background: var(--canvas); color: var(--ink-950); }
    .nav-item.active { background: var(--hover); color: var(--ink-950); font-weight: 620; }
    .nav-item.active .icon { color: var(--accent); }
    .nav-count { margin-left: auto; color: var(--ink-500); font-size: 11px; }
    .sidebar-foot { border-top: 1px solid var(--line); padding: 10px; }
    .profile-trigger {
      display: grid; width: 100%; grid-template-columns: 34px 1fr 16px; align-items: center; gap: 9px;
      border: 0; border-radius: 10px; background: transparent; padding: 7px; cursor: pointer; text-align: left;
    }
    .profile-trigger:hover { background: var(--canvas); }
    .avatar {
      display: inline-grid; flex: 0 0 auto; width: 34px; height: 34px; place-items: center;
      border-radius: 50%; background: var(--accent-soft); color: var(--accent-dark); font-size: 11px; font-weight: 750;
    }
    .avatar.blue { background: var(--blue-soft); color: var(--blue); }
    .avatar.purple { background: var(--purple-soft); color: var(--purple); }
    .avatar.amber { background: var(--amber-soft); color: var(--amber); }
    .avatar.dark { background: var(--ink-950); color: white; }
    .profile-name { overflow: hidden; font-size: 12px; font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .profile-role { overflow: hidden; color: var(--ink-500); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

    .main { min-width: 0; display: flex; flex-direction: column; }
    .topbar {
      height: var(--topbar); flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .9);
      padding: 0 22px; backdrop-filter: blur(16px);
    }
    .mobile-menu { display: none; }
    .account-chip {
      display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 8px;
      background: transparent; padding: 6px 8px; cursor: pointer; font-size: 12px; font-weight: 620;
    }
    .account-chip:hover { background: var(--canvas); }
    .env-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .search-button {
      display: flex; width: min(420px, 42vw); align-items: center; gap: 8px; margin: 0 auto;
      border: 1px solid var(--line); border-radius: 9px; background: var(--canvas);
      padding: 7px 10px; color: var(--ink-500); cursor: pointer; text-align: left;
    }
    .search-button:hover { border-color: var(--line-strong); background: var(--panel); }
    .shortcut { margin-left: auto; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); padding: 0 5px; font-size: 10px; }
    .icon-button {
      display: inline-grid; width: 34px; height: 34px; place-items: center; border: 0;
      border-radius: 8px; background: transparent; color: var(--ink-650); cursor: pointer;
    }
    .icon-button:hover { background: var(--canvas); color: var(--ink-950); }
    .content { flex: 1; overflow-y: auto; }
    .page { width: min(1440px, 100%); margin: 0 auto; padding: 30px 32px 64px; animation: fade 160ms ease-out; }
    @keyframes fade { from { opacity: .35; transform: translateY(2px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    .breadcrumbs { display: flex; align-items: center; gap: 6px; margin-bottom: 13px; color: var(--ink-500); font-size: 11px; }
    .page-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; margin-bottom: 25px; }
    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 28px; line-height: 1.15; letter-spacing: -.035em; }
    h2 { font-size: 16px; line-height: 1.3; letter-spacing: -.015em; }
    h3 { font-size: 13px; line-height: 1.35; }
    .lede { max-width: 720px; margin-top: 7px; color: var(--ink-650); font-size: 14px; }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-height: 34px; border: 1px solid var(--line-strong); border-radius: 8px;
      background: var(--panel); padding: 7px 11px; cursor: pointer; font-size: 12px; font-weight: 650;
    }
    .button:hover { background: var(--canvas); }
    .button.primary { border-color: var(--ink-950); background: var(--ink-950); color: white; }
    .button.primary:hover { background: var(--ink-800); }
    .button.danger { border-color: #efc7c2; color: var(--red); }
    .button.ghost { border-color: transparent; background: transparent; color: var(--ink-650); }
    .button.sm { min-height: 29px; padding: 5px 9px; font-size: 11px; }

    .grid { display: grid; gap: 14px; }
    .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .grid.asym { grid-template-columns: minmax(0, 1.55fr) minmax(300px, .85fr); }
    .stack { display: flex; flex-direction: column; gap: 14px; }
    .section { margin-top: 26px; }
    .section-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 11px; }
    .section-note { color: var(--ink-500); font-size: 11px; }
    .card { min-width: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    .card.pad { padding: 17px; }
    .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-bottom: 1px solid var(--line); padding: 12px 15px; }
    .card-body { padding: 15px; }
    .soft { background: var(--canvas); }
    .metric { padding: 16px; }
    .metric-label { color: var(--ink-500); font-size: 11px; font-weight: 620; }
    .metric-value { margin-top: 7px; font-size: 27px; font-weight: 680; letter-spacing: -.035em; }
    .metric-meta { margin-top: 5px; color: var(--ink-500); font-size: 11px; }
    .positive { color: var(--accent-dark); }
    .negative { color: var(--red); }

    .badge {
      display: inline-flex; align-items: center; gap: 5px; width: fit-content;
      border-radius: 999px; background: var(--panel-soft); padding: 3px 7px;
      color: var(--ink-650); font-size: 10px; font-weight: 700; white-space: nowrap;
    }
    .badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--ink-350); }
    .badge.ok { background: var(--accent-soft); color: var(--accent-dark); }
    .badge.ok::before { background: var(--accent); }
    .badge.warn { background: var(--amber-soft); color: var(--amber); }
    .badge.warn::before { background: #e99a16; }
    .badge.risk { background: var(--red-soft); color: var(--red); }
    .badge.risk::before { background: var(--red); }
    .badge.info { background: var(--blue-soft); color: var(--blue); }
    .badge.info::before { background: var(--blue); }
    .badge.no-dot::before { display: none; }

    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { border-bottom: 1px solid var(--line); padding: 10px 13px; text-align: left; vertical-align: middle; }
    th { background: var(--canvas); color: var(--ink-500); font-size: 10px; font-weight: 750; letter-spacing: .045em; text-transform: uppercase; }
    td { color: var(--ink-650); font-size: 12px; }
    tbody tr:last-child td { border-bottom: 0; }
    tbody tr.clickable { cursor: pointer; }
    tbody tr.clickable:hover td { background: #fafafa; }
    .strong { color: var(--ink-950); font-weight: 650; }
    .muted { color: var(--ink-500); }
    .micro { font-size: 10px; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; }
    .identity { display: flex; align-items: center; gap: 9px; min-width: 180px; }
    .identity .avatar { width: 30px; height: 30px; }
    .identity-main { min-width: 0; }
    .identity-name { overflow: hidden; color: var(--ink-950); font-weight: 650; text-overflow: ellipsis; white-space: nowrap; }
    .identity-meta { overflow: hidden; color: var(--ink-500); font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }

    .attention { display: flex; align-items: flex-start; gap: 11px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .attention:last-child { border-bottom: 0; }
    .attention-icon { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border-radius: 8px; }
    .attention-icon.warn { background: var(--amber-soft); color: var(--amber); }
    .attention-icon.risk { background: var(--red-soft); color: var(--red); }
    .attention-icon.info { background: var(--blue-soft); color: var(--blue); }
    .attention-copy { flex: 1; min-width: 0; }
    .attention-title { font-size: 12px; font-weight: 650; }
    .attention-sub { margin-top: 2px; color: var(--ink-500); font-size: 11px; }
    .attention-time { flex: 0 0 auto; color: var(--ink-350); font-size: 10px; }

    .segmented { display: inline-flex; gap: 2px; border-radius: 8px; background: var(--panel-soft); padding: 3px; }
    .segment { border: 0; border-radius: 6px; background: transparent; padding: 5px 9px; color: var(--ink-500); cursor: pointer; font-size: 11px; }
    .segment.active { background: var(--panel); color: var(--ink-950); box-shadow: 0 1px 2px rgba(16,17,20,.08); font-weight: 650; }
    .tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); }
    .tab { border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 9px 11px; color: var(--ink-500); cursor: pointer; white-space: nowrap; }
    .tab.active { border-bottom-color: var(--ink-950); color: var(--ink-950); font-weight: 650; }

    .bars { display: flex; height: 148px; align-items: end; gap: 8px; padding: 15px 2px 2px; }
    .bar-col { display: flex; min-width: 0; flex: 1; flex-direction: column; justify-content: end; gap: 5px; height: 100%; }
    .bar { min-height: 4px; border-radius: 4px 4px 1px 1px; background: var(--accent); opacity: .82; }
    .bar-label { overflow: hidden; color: var(--ink-350); font-size: 9px; text-align: center; text-overflow: ellipsis; white-space: nowrap; }
    .legend { display: flex; gap: 14px; color: var(--ink-500); font-size: 10px; }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }
    .legend i { width: 7px; height: 7px; border-radius: 2px; background: var(--accent); }

    .progress { height: 6px; overflow: hidden; border-radius: 999px; background: var(--panel-soft); }
    .progress > span { display: block; height: 100%; border-radius: inherit; background: var(--accent); }
    .connection-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .connection-card { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 15px; cursor: pointer; }
    .connection-card:hover { border-color: var(--line-strong); }
    .provider-mark { display: grid; width: 36px; height: 36px; place-items: center; border-radius: 10px; background: var(--ink-950); color: white; font-weight: 750; }
    .connection-top { display: flex; align-items: flex-start; justify-content: space-between; }
    .connection-name { margin-top: 13px; font-size: 13px; font-weight: 680; }
    .connection-meta { margin-top: 3px; color: var(--ink-500); font-size: 10px; }
    .connection-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 11px; }
    .small-stat span { display: block; color: var(--ink-500); font-size: 9px; text-transform: uppercase; letter-spacing: .05em; }
    .small-stat strong { display: block; margin-top: 2px; font-size: 12px; }

    .trace-grid { display: grid; grid-template-columns: 270px 1fr 310px; min-height: 490px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); overflow: hidden; }
    .trace-pane { min-width: 0; padding: 14px; border-right: 1px solid var(--line); }
    .trace-pane:last-child { border-right: 0; }
    .trace-node { margin-left: calc(var(--depth, 0) * 13px); border-radius: 7px; padding: 8px; cursor: pointer; color: var(--ink-650); font-size: 11px; }
    .trace-node:hover, .trace-node.active { background: var(--canvas); color: var(--ink-950); }
    .timeline-row { display: grid; grid-template-columns: 135px 1fr 48px; align-items: center; gap: 10px; height: 33px; font-size: 10px; }
    .timeline-track { position: relative; height: 7px; border-radius: 999px; background: var(--panel-soft); }
    .timeline-span { position: absolute; top: 0; left: var(--start); width: var(--width); height: 100%; border-radius: inherit; background: var(--accent); }
    .timeline-span.tool { background: var(--blue); }
    .timeline-span.mcp { background: var(--purple); }
    .kv { display: grid; grid-template-columns: 100px minmax(0,1fr); gap: 7px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 11px; }
    .kv:last-child { border-bottom: 0; }
    .kv dt { color: var(--ink-500); }
    .kv dd { margin: 0; overflow-wrap: anywhere; color: var(--ink-950); }

    .role-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .role-card { border: 1px solid var(--line); border-radius: 11px; padding: 13px; }
    .role-card h3 { margin-bottom: 5px; }
    .role-card p { color: var(--ink-500); font-size: 10px; }
    .scope-list { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
    .scope { border-radius: 5px; background: var(--canvas); padding: 3px 6px; color: var(--ink-650); font-size: 9px; }

    .empty-line { height: 1px; background: var(--line); }
    .profile-hero { display: grid; grid-template-columns: 86px 1fr auto; align-items: center; gap: 18px; }
    .profile-hero .avatar { width: 78px; height: 78px; font-size: 20px; }
    .profile-hero h1 { font-size: 24px; }
    .detail-list { display: flex; flex-direction: column; }
    .detail-row { display: grid; grid-template-columns: 180px 1fr auto; align-items: center; gap: 12px; min-height: 51px; border-bottom: 1px solid var(--line); }
    .detail-row:last-child { border-bottom: 0; }
    .detail-label { color: var(--ink-500); font-size: 11px; }
    .detail-value { font-size: 12px; font-weight: 620; }

    .drawer, .popover, .palette { position: fixed; z-index: 50; }
    .popover {
      right: 14px; top: 54px; width: 240px; border: 1px solid var(--line);
      border-radius: 12px; background: var(--panel); padding: 7px; box-shadow: var(--shadow-float);
    }
    .popover.hidden, .palette.hidden, .overlay.hidden { display: none; }
    .popover-item { display: flex; width: 100%; align-items: center; gap: 9px; border: 0; border-radius: 7px; background: transparent; padding: 8px; cursor: pointer; color: var(--ink-650); text-align: left; font-size: 11px; }
    .popover-item:hover { background: var(--canvas); color: var(--ink-950); }
    .overlay { position: fixed; inset: 0; z-index: 45; background: rgba(16,17,20,.26); backdrop-filter: blur(2px); }
    .palette { top: 12vh; left: 50%; width: min(620px, calc(100vw - 28px)); transform: translateX(-50%); border: 1px solid var(--line); border-radius: 15px; background: var(--panel); box-shadow: var(--shadow-float); overflow: hidden; }
    .palette-input { width: 100%; border: 0; border-bottom: 1px solid var(--line); outline: 0; padding: 16px; font-size: 15px; }
    .palette-results { max-height: 410px; overflow-y: auto; padding: 7px; }
    .palette-result { display: flex; width: 100%; align-items: center; gap: 10px; border: 0; border-radius: 8px; background: transparent; padding: 10px; cursor: pointer; text-align: left; }
    .palette-result:hover, .palette-result.selected { background: var(--canvas); }
    .palette-result small { display: block; color: var(--ink-500); }
    .toast { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 9px; border: 1px solid var(--line); border-radius: 10px; background: var(--ink-950); padding: 10px 13px; color: white; box-shadow: var(--shadow-float); font-size: 11px; transition: opacity 180ms ease, transform 180ms ease; }
    .toast.hidden { pointer-events: none; opacity: 0; transform: translateY(8px); }

    @media (max-width: 1080px) {
      .grid.four, .role-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .connection-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .trace-grid { grid-template-columns: 230px 1fr; }
      .trace-pane:last-child { grid-column: 1 / -1; border-top: 1px solid var(--line); }
    }
    @media (max-width: 780px) {
      body { overflow: auto; }
      .app { display: block; height: auto; min-height: 100vh; }
      .sidebar { position: fixed; z-index: 40; inset: 0 auto 0 0; width: var(--rail); transform: translateX(-100%); transition: transform 180ms ease; box-shadow: var(--shadow-float); }
      .sidebar.open { transform: translateX(0); }
      .mobile-menu { display: inline-grid; }
      .topbar { position: sticky; top: 0; z-index: 30; }
      .account-chip span:not(.env-dot) { display: none; }
      .search-button { width: auto; flex: 1; }
      .search-button > span:not(.shortcut) { display: none; }
      .page { padding: 24px 16px 48px; }
      .page-head, .profile-hero { grid-template-columns: 1fr; display: grid; }
      .grid.two, .grid.three, .grid.four, .grid.asym, .connection-grid, .role-grid { grid-template-columns: 1fr; }
      .trace-grid { grid-template-columns: 1fr; }
      .trace-pane { border-right: 0; border-bottom: 1px solid var(--line); }
      .detail-row { grid-template-columns: 1fr; gap: 3px; padding: 10px 0; }
    }
  </style>
</head>

    <symbol id="i-control" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></symbol>

    let currentView = "home";
    const content = document.getElementById("content");
    const sidebar = document.getElementById("sidebar");
    const popover = document.getElementById("profile-popover");
    const overlay = document.getElementById("overlay");
    const palette = document.getElementById("palette");
    const paletteInput = document.getElementById("palette-input");
    const paletteResults = document.getElementById("palette-results");

    function navigate(view) {
      if (!views[view]) return;
      currentView = view;
      content.innerHTML = `<div class="page">${views[view].render()}</div>`;
      content.scrollTop = 0;
      document.querySelectorAll("[data-view]").forEach(el => el.classList.toggle("active", el.dataset.view === view && el.classList.contains("nav-item")));
      popover.classList.add("hidden");
      closePalette();
      sidebar.classList.remove("open");
      history.replaceState(null, "", `#${view}`);
      content.focus({preventScroll:true});
    }

    document.addEventListener("click", event => {
      const target = event.target.closest("[data-view]");
      if (target) navigate(target.dataset.view);
    });

    document.getElementById("top-profile").addEventListener("click", event => {
      event.stopPropagation();
      popover.classList.toggle("hidden");
    });
    document.addEventListener("click", event => {
      if (!event.target.closest("#profile-popover") && !event.target.closest("#top-profile")) popover.classList.add("hidden");
    });
    document.getElementById("mobile-menu").addEventListener("click", () => sidebar.classList.toggle("open"));

    function renderPalette(query = "") {
      const q = query.trim().toLowerCase();
      const matches = Object.entries(views).filter(([,v]) => !q || `${v.label} ${v.group}`.toLowerCase().includes(q));
      paletteResults.innerHTML = matches.map(([key,v],i) => `<button class="palette-result ${i===0?"selected":""}" data-view="${key}">${icon(key==="profile"?"user":key==="mcp"?"nodes":key==="keys"?"key":key==="assurance"?"shield":"arrow")}<span><strong>${v.label}</strong><small>${v.group}</small></span></button>`).join("") || `<div class="muted" style="padding:20px;text-align:center">No matching screen</div>`;
    }
    function openPalette() {
      popover.classList.add("hidden"); overlay.classList.remove("hidden"); palette.classList.remove("hidden");
      renderPalette(); requestAnimationFrame(() => paletteInput.focus());
    }
    function closePalette() { overlay.classList.add("hidden"); palette.classList.add("hidden"); paletteInput.value = ""; }
    document.getElementById("open-search").addEventListener("click", openPalette);
    overlay.addEventListener("click", closePalette);
    paletteInput.addEventListener("input", e => renderPalette(e.target.value));
    document.addEventListener("keydown", event => {
      if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === "k") { event.preventDefault(); openPalette(); }
      if (event.key === "Escape") { closePalette(); popover.classList.add("hidden"); sidebar.classList.remove("open"); }
      if (event.key === "Enter" && !palette.classList.contains("hidden")) {
        const selected = paletteResults.querySelector(".palette-result");
        if (selected) navigate(selected.dataset.view);
      }
    });

    let toastTimer;
    window.showToast = function(message) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-text").textContent = message;
      toast.classList.remove("hidden");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.add("hidden"), 2600);
    };

    navigate(location.hash.slice(1) || "home");
  </script>
