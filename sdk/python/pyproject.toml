[project]
name = "aap-trace"
version = "0.1.0"
description = "Agent Assurance — thin OpenTelemetry GenAI tracing SDK for Observe ingest"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Agent Assurance" }]
dependencies = [
    "opentelemetry-api>=1.27.0,<2",
    "opentelemetry-sdk>=1.27.0,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27.0,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
openai = ["openai>=1.40.0"]
anthropic = ["anthropic>=0.34.0"]
langchain = ["langchain-core>=0.3.0"]
langgraph = ["langgraph>=1.0,<2"]
llama-index = ["llama-index-core>=0.11.0"]
crewai = ["crewai>=0.70.0"]
asgi = ["starlette>=0.38.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "opentelemetry-sdk>=1.27.0",
    "langgraph>=1.0,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"src/aap_trace/integrations/**" = ["E501"]
"src/aap_trace/spans.py" = ["E501"]
"src/aap_trace/config.py" = ["E501"]
"src/aap_trace/streaming.py" = ["UP047"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["aap_trace"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "aap_trace.integrations.langchain"
disable_error_code = ["misc", "valid-type"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
