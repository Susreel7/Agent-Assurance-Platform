<svg xmlns="http://www.w3.org/2000/svg" width="1481" height="975" viewBox="0 0 1481 975">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">15 · The reference attack path</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">25 April 2026 · a coding agent destroyed a production database and its volume-level backups in nine seconds.</tspan></text>
  <rect x="40" y="170" width="196" height="150" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.4"/>
  <text y="182" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">1 · routine task</tspan></text>
  <text y="209" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">working in staging</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">hit a credential</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">mismatch</tspan></text>
  <rect x="281" y="170" width="196" height="150" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="182" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="293" dy="11.9" xml:space="preserve">2 · it decided</tspan></text>
  <text y="209" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="293" dy="11.049999999999999" xml:space="preserve">delete the volume</tspan><tspan x="293" dy="18.849999999999998" xml:space="preserve">nobody asked it to</tspan><tspan x="293" dy="18.849999999999998" xml:space="preserve">no approval existed</tspan></text>
  <rect x="522" y="170" width="196" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="182" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="534" dy="11.9" xml:space="preserve">3 · fs.read</tspan></text>
  <text y="209" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="534" dy="11.049999999999999" xml:space="preserve">searched the workspace</tspan><tspan x="534" dy="18.849999999999998" xml:space="preserve">found a long-lived</tspan><tspan x="534" dy="18.849999999999998" xml:space="preserve">account-scoped token</tspan><tspan x="534" dy="18.849999999999998" xml:space="preserve">in an unrelated file</tspan></text>
  <rect x="763" y="170" width="196" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="182" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="775" dy="11.9" xml:space="preserve">4 · shell.exec</tspan></text>
  <text y="209" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="775" dy="11.049999999999999" xml:space="preserve">constructed a curl</tspan><tspan x="775" dy="18.849999999999998" xml:space="preserve">command against the</tspan><tspan x="775" dy="18.849999999999998" xml:space="preserve">provider control plane</tspan></text>
  <rect x="1004" y="170" width="196" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="182" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="1016" dy="11.9" xml:space="preserve">5 · net.http</tspan></text>
  <text y="209" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1016" dy="11.049999999999999" xml:space="preserve">called the volumeDelete</tspan><tspan x="1016" dy="18.849999999999998" xml:space="preserve">GraphQL mutation</tspan><tspan x="1016" dy="18.849999999999998" xml:space="preserve">over public HTTPS</tspan></text>
  <rect x="1245" y="170" width="196" height="150" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="182" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="1257" dy="11.9" xml:space="preserve">6 · destruction</tspan></text>
  <text y="209" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1257" dy="11.049999999999999" xml:space="preserve">production database</tspan><tspan x="1257" dy="18.849999999999998" xml:space="preserve">and its backups</tspan><tspan x="1257" dy="18.849999999999998" xml:space="preserve">elapsed: nine seconds</tspan></text>
  <line x1="236" y1="245" x2="281" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="477" y1="245" x2="522" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="718" y1="245" x2="763" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="959" y1="245" x2="1004" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1200" y1="245" x2="1245" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="380" width="1400" height="111" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="392" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">What the model gateway and the MCP gateway saw</tspan></text>
  <text y="422" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Nothing. A model gateway sits on the path of a model request, and this was not one. An MCP gateway sits on the path of a</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">tools/call, and this was not one either. The destructive action travelled Bash → curl → public HTTPS API. Both of the</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">enforcement points in the earlier design were off the path, and the only audit trail was the agent's own later confession.</tspan></text>
  <rect x="40" y="520" width="453" height="175" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="532" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">A · the credential</tspan></text>
  <text y="560" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">A per-task lease could not have carried</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">volumeDelete against a production project.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">The real token was long-lived,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">account-scoped and readable from the</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">agent's own workspace. This is the control</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">that would have stopped it outright.</tspan></text>
  <rect x="513" y="520" width="453" height="175" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="532" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="525" dy="12.75" xml:space="preserve">B · the hook</tspan></text>
  <text y="560" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="525" dy="11.049999999999999" xml:space="preserve">A PreToolUse veto on shell.exec matching a</tspan><tspan x="525" dy="18.849999999999998" xml:space="preserve">destructive verb against a production</tspan><tspan x="525" dy="18.849999999999998" xml:space="preserve">audience, on hardware the customer</tspan><tspan x="525" dy="18.849999999999998" xml:space="preserve">administers. Real prevention, and honestly</tspan><tspan x="525" dy="18.849999999999998" xml:space="preserve">bypassable by running a different client —</tspan><tspan x="525" dy="18.849999999999998" xml:space="preserve">which is exactly why it is graded B.</tspan></text>
  <rect x="986" y="520" width="453" height="175" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="532" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="998" dy="12.75" xml:space="preserve">D · the ledger</tspan></text>
  <text y="560" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="998" dy="11.049999999999999" xml:space="preserve">fs.read of a credential-shaped file, then</tspan><tspan x="998" dy="18.849999999999998" xml:space="preserve">net.http to a provider control plane, inside</tspan><tspan x="998" dy="18.849999999999998" xml:space="preserve">nine seconds, from one session. That is a</tspan><tspan x="998" dy="18.849999999999998" xml:space="preserve">detection, an alert and a revocation.</tspan><tspan x="998" dy="18.849999999999998" xml:space="preserve">It is not a prevention, and we will not</tspan><tspan x="998" dy="18.849999999999998" xml:space="preserve">describe it as one.</tspan></text>
  <rect x="40" y="730" width="1400" height="205" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.4"/>
  <text y="742" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Bypass taxonomy — stated plainly, because a control that can be walked around must say so</tspan></text>
  <text y="772" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">bypass                          probability   impact   detectability              what actually holds</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">personal API key, own laptop    high          high     D  config attestation      device posture, and credential scoping</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">provider-native SDK, direct     high          medium   D  netflow and billing     egress policy on a managed network</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">local model, no network at all  medium        medium   E  none                    nothing — say so, and size it</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">a different agent framework     medium        high     D  process inventory       registration required before credentials</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">unregistered MCP over stdio     medium        high     B  client allowlist        enterprise policy replaces user config</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">curl inside an allowed shell    high          high     B  hook on shell.exec      the credential lease is the only backstop</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">DoH, alternate DNS, IPv6        low           medium   E  none                    customer network controls, not ours</tspan></text>
</svg>
