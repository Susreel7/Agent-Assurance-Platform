<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="968" viewBox="0 0 1540 968">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">16 · MVP schema and UI blueprint</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">What is reused, what F1 adds, and how the existing console becomes the action ledger without building a second product shell.</tspan></text>
  <rect x="40" y="130" width="450" height="650" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4" stroke-dasharray="8 6"/>
  <text y="142" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="54" dy="12.75" xml:space="preserve">POSTGRES · reuse; never duplicate</tspan></text>
  <rect x="70" y="185" width="390" height="149" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="197" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="82" dy="13.6" xml:space="preserve">Identity already present</tspan></text>
  <text y="227" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="82" dy="11.049999999999999" xml:space="preserve">organizations + org_id · keep for MVP</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">members + member_identities</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">agents + append-only agent_versions</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">agent_ownership</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">workload_credentials + generations</tspan></text>
  <rect x="70" y="355" width="390" height="149" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="367" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="82" dy="13.6" xml:space="preserve">Authorization and control already present</tspan></text>
  <text y="397" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="82" dy="11.049999999999999" xml:space="preserve">roles + access_grants + access_requests</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">teams + team_members — dual-read until M2</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">mcp_servers + snapshots + capabilities + grants</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">provider_connections + secret versions</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">policies + policy_versions + decisions</tspan></text>
  <rect x="70" y="565" width="390" height="149" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="577" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="82" dy="13.6" xml:space="preserve">Do not overload</tspan></text>
  <text y="607" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="82" dy="11.049999999999999" xml:space="preserve">auth_sessions = human browser login</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">evidence_events = durable assurance evidence</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">security_audit_events = admin/config mutations</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">Observe ClickHouse = rich OTLP executions</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">none of these is the action ledger</tspan></text>
  <rect x="520" y="130" width="450" height="650" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4" stroke-dasharray="8 6"/>
  <text y="142" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="534" dy="12.75" xml:space="preserve">F1 · additive from real head 0022</tspan></text>
  <rect x="550" y="185" width="390" height="149" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="197" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="562" dy="13.6" xml:space="preserve">0023 · runtime identity</tspan></text>
  <text y="227" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="562" dy="11.049999999999999" xml:space="preserve">agent_instances → existing agent + version + human</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">agent_sessions → instance; taint</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">agent_tasks → session; origin + intent digest</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">delegations → parent/child; subset + expiry</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">RLS on every org-scoped table</tspan></text>
  <rect x="550" y="405" width="390" height="186" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="417" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="562" dy="13.6" xml:space="preserve">0024 · agent_actions ledger</tspan></text>
  <text y="447" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="562" dy="11.049999999999999" xml:space="preserve">monthly Postgres partitions · append-only</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">receipt registry gives event-id idempotency</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">aap.action.v1 identity + capability + decision</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">enforcement grade required; unknown counts as E</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">argument digest + bounded facets only</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">collector hash chain + downstream mutation ref</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">no prompt · completion · raw argument · file body</tspan></text>
  <rect x="550" y="650" width="390" height="108" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="662" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="562" dy="11.9" xml:space="preserve">Naming prevents collisions</tspan></text>
  <text y="689" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="562" dy="11.049999999999999" xml:space="preserve">auth_sessions = human</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">agent_sessions = agent context</tspan><tspan x="562" dy="18.849999999999998" xml:space="preserve">agent_actions = security ledger</tspan></text>
  <rect x="1000" y="130" width="500" height="650" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4" stroke-dasharray="8 6"/>
  <text y="142" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="1014" dy="12.75" xml:space="preserve">CONSOLE · reuse and improve</tspan></text>
  <rect x="1030" y="185" width="440" height="149" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="197" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1042" dy="13.6" xml:space="preserve">One shell and one bootstrap</tspan></text>
  <text y="227" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1042" dy="11.049999999999999" xml:space="preserve">App.tsx owns routes · Shell.tsx owns chrome</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">server navigation manifest; no second identity query</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">DataBoundary: loading · empty · reasoned error · data</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">URL-owned filters; exact active route</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">EnforcementGrade on every ledger number</tspan></text>
  <rect x="1030" y="395" width="440" height="149" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="407" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1042" dy="13.6" xml:space="preserve">Reuse the working UI</tspan></text>
  <text y="437" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1042" dy="11.049999999999999" xml:space="preserve">Observe list/detail/timeline/graph patterns</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">Nexus shell, cards, badges and theme tokens</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">People · Access · MCP · Connections · Audit</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">Pagination · RelativeTime · WindowDaysSelect</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">same-origin /v1 client + generated OpenAPI types</tspan></text>
  <rect x="1030" y="600" width="440" height="149" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="612" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1042" dy="13.6" xml:space="preserve">Ledger-first information architecture</tspan></text>
  <text y="642" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1042" dy="11.049999999999999" xml:space="preserve">Home: coverage · risk · collectors · exposures</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">Ledger: Actions · Sessions · Live</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">Agents · Discovery · Control · Admin</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">assurance-era routes stay reachable behind flags</tspan><tspan x="1042" dy="18.849999999999998" xml:space="preserve">no fake counts and no show-prompt button</tspan></text>
  <line x1="490" y1="455" x2="520" y2="455" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <text y="428" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="12"><tspan x="459" dy="10.2" xml:space="preserve">FKs; no copies</tspan></text>
  <line x1="970" y1="455" x2="1000" y2="455" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <text y="428" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="12"><tspan x="942.5" dy="10.2" xml:space="preserve">typed /v1 API</tspan></text>
  <rect x="40" y="820" width="1460" height="108" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="832" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">The invariant tying all three zones together</tspan></text>
  <text y="859" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Pick one action. The database can reconstruct its human root, agent version, instance, session, task, capability, decision,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">policy and grade; the API reveals no customer content; the UI shows the chain using existing components and says exactly</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">whether the row was mediated, veto-capable, vendor-attested, observed afterwards, or uncovered.</tspan></text>
</svg>
