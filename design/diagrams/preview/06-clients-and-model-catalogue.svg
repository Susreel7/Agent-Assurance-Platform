<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1065" viewBox="0 0 1540 1065">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">06 · Client wiring and model catalogue</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">What each coding client actually lets an enterprise control, and how a new model reaches users without an engineer.</tspan></text>
  <rect x="40" y="150" width="350" height="243" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Cursor</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Route:  Override OpenAI Base URL → our</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">OpenAI-compatible endpoint, key = platform key.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Caveat: the override currently carries all</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">OpenAI-family traffic, including built-in</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">picks.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Org control: Admin API model access policy,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">disable personal BYOK, MCP server allowlist,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">permissions.json auto-run allowlist via MDM.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Limit: client-side allowlists are advisory —</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">enforcement has to be ours, server side.</tspan></text>
  <rect x="410" y="150" width="350" height="243" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="422" dy="13.6" xml:space="preserve">Claude Code</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="422" dy="11.049999999999999" xml:space="preserve">Route:  ANTHROPIC_BASE_URL + auth token,</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">or the Bedrock/Vertex/Foundry base URLs.</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">Org control: managed settings deliver</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">availableModels (checked at the gateway too),</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">permissions allow/ask/deny,</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">allowManagedPermissionRulesOnly,</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">allowedMcpServers + allowManagedMcpServersOnly,</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">disableBypassPermissionsMode.</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">Caveat: a delivered base URL can prompt the</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">user.</tspan></text>
  <rect x="780" y="150" width="350" height="205" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="792" dy="13.6" xml:space="preserve">Codex CLI</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="792" dy="11.049999999999999" xml:space="preserve">Route:  ~/.codex/config.toml</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">[model_providers.aap] base_url, env_key,</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">wire_api = &quot;responses&quot;.</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">So our gateway must implement the Responses</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">API, not only chat completions.</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">Org control: provider keys are user-level;</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">project configs cannot override them, which</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">is useful — a repo cannot redirect traffic.</tspan></text>
  <rect x="1150" y="150" width="350" height="205" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1162" dy="13.6" xml:space="preserve">Gemini CLI</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1162" dy="11.049999999999999" xml:space="preserve">Route:  GOOGLE_GEMINI_BASE_URL, or</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">GOOGLE_VERTEX_BASE_URL for Vertex auth.</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">Honoured through the genai SDK http options;</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">HTTPS required off localhost, and the</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">behaviour has moved between releases — pin</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">a version in the rollout guide.</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">Org control: thin. Treat the gateway plus MDM</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">as the only real enforcement.</tspan></text>
  <rect x="40" y="430" width="1460" height="111" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="442" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">One-click onboarding — the console generates all of this per member and environment</tspan></text>
  <text y="472" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Pick a client and an environment → the console issues a scoped platform key, prints the exact config, and offers an MDM bundle.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">It also runs a preflight: key valid · alias reachable · residency attested · MCP grants present · a live test call and tool list.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">If the preflight fails it names the missing step and links to it. 'It shows zero tools' must never be something a user has to debug.</tspan></text>
  <rect x="40" y="600" width="300" height="149" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="612" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Catalogue job (hourly)</tspan></text>
  <text y="642" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Lists models per provider:</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Azure deployments, Bedrock</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">foundation models, Vertex</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">publishers, OpenAI /models,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">local runtime /v1/models</tspan></text>
  <rect x="360" y="600" width="300" height="130" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="612" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="372" dy="13.6" xml:space="preserve">Candidate rows</tspan></text>
  <text y="642" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="372" dy="11.049999999999999" xml:space="preserve">New / changed / withdrawn</tspan><tspan x="372" dy="18.849999999999998" xml:space="preserve">Pulls context window, modality,</tspan><tspan x="372" dy="18.849999999999998" xml:space="preserve">price, deployment SKU, region</tspan><tspan x="372" dy="18.849999999999998" xml:space="preserve">Never auto-enabled</tspan></text>
  <rect x="680" y="600" width="300" height="130" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="612" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="692" dy="13.6" xml:space="preserve">Admin review</tspan></text>
  <text y="642" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="692" dy="11.049999999999999" xml:space="preserve">Diff view + provider evidence</tspan><tspan x="692" dy="18.849999999999998" xml:space="preserve">Set residency_class,</tspan><tspan x="692" dy="18.849999999999998" xml:space="preserve">max data class, cost ceiling</tspan><tspan x="692" dy="18.849999999999998" xml:space="preserve">Approve → alias target</tspan></text>
  <rect x="1000" y="600" width="240" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="612" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1012" dy="13.6" xml:space="preserve">Aliases</tspan></text>
  <text y="642" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1012" dy="11.049999999999999" xml:space="preserve">aap-fast</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">aap-balanced</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">aap-deep</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">aap-internal-secure</tspan></text>
  <rect x="1260" y="600" width="240" height="111" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="612" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1272" dy="13.6" xml:space="preserve">Rollout</tspan></text>
  <text y="642" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1272" dy="11.049999999999999" xml:space="preserve">Bundle signed + versioned</tspan><tspan x="1272" dy="18.849999999999998" xml:space="preserve">Clients see the new model</tspan><tspan x="1272" dy="18.849999999999998" xml:space="preserve">with no config change</tspan></text>
  <line x1="340" y1="674.5" x2="360" y2="665" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="660" y1="665" x2="680" y2="665" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="980" y1="665" x2="1000" y2="665" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1240" y1="665" x2="1260" y2="655.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="820" width="720" height="205" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="832" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Routing rules an admin writes (no code)</tspan></text>
  <text y="862" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">subject: org_unit=ide-users, environment=prod</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">mode_default: balanced          # cost | balanced | quality | residency_strict</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">split:  aap-balanced 70%  ·  aap-deep 20%  ·  aap-internal-secure 10%</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">hard_constraints:</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">   residency: eu_zone_or_stricter</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">   max_data_class: internal</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">   monthly_budget_usd: 12000   # then degrade to aap-fast, then block</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">overrides: member may request a specific alias if it satisfies the constraints</tspan></text>
  <rect x="800" y="820" width="700" height="186" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="832" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="812" dy="13.6" xml:space="preserve">How the router decides</tspan></text>
  <text y="862" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="812" dy="11.049999999999999" xml:space="preserve">1. Filter  endpoints failing a hard constraint are removed — never overridden by weights.</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">2. Score   quality/cost/latency from a rolling window per endpoint, not a static table.</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">3. Pick    weighted choice with deterministic tie-break on (session, alias) so a</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">           conversation stays on one endpoint unless it degrades.</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">4. Track   actual split is reported against the target; drift shows as a metric.</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">5. Degrade budget exhaustion and breaker trips walk down a declared ladder, and the</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">           reason is attached to the response headers and the event.</tspan></text>
</svg>
