  <text y="212" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1202" dy="11.049999999999999" xml:space="preserve">Rollups by org unit / member / model /</tspan><tspan x="1202" dy="18.849999999999998" xml:space="preserve">tool</tspan><tspan x="1202" dy="18.849999999999998" xml:space="preserve">Risk scores · alerts · evidence index</tspan><tspan x="1202" dy="18.849999999999998" xml:space="preserve">No prompt bodies, no tool payloads</tspan></text>
