  <text y="662" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="82" dy="11.049999999999999" xml:space="preserve">Cursor</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">Claude Code</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">Codex CLI</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">Gemini CLI</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">In-house agents / SDKs</tspan><tspan x="82" dy="18.849999999999998" xml:space="preserve">Base URL + platform key only</tspan></text>
