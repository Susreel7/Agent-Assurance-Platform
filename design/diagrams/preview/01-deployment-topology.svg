  <text y="421" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="12"><tspan x="1340.5" dy="10.2" xml:space="preserve">signed telemetry</tspan><tspan x="1340.5" dy="17.4" xml:space="preserve">envelopes</tspan></text>
  <rect x="40" y="1160" width="730" height="108" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="1172" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">Invariant — the control plane is not on the request path</tspan></text>
  <text y="1199" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">A control-plane outage must not open access. The data plane runs the last signed</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">policy bundle, keeps enforcing, and buffers telemetry. Bundles carry an expiry;</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">past expiry the data plane fails closed for regulated classes and read-only for the rest.</tspan></text>
  <rect x="810" y="1160" width="730" height="108" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="1172" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="822" dy="11.9" xml:space="preserve">Invariant — payload separation</tspan></text>
  <text y="1199" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="822" dy="11.049999999999999" xml:space="preserve">Prompt bodies, completions and tool arguments are written only to the customer-side</tspan><tspan x="822" dy="18.849999999999998" xml:space="preserve">payload store, referenced by digest. The control plane stores counts, digests, decisions</tspan><tspan x="822" dy="18.849999999999998" xml:space="preserve">and reason codes. Revealing a payload is a separate permission plus an audited approval.</tspan></text>
</svg>
