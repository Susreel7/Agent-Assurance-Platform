<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1107" viewBox="0 0 1540 1107">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">07 · MCP onboarding, grants and tool blocking</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">Three screens to onboard a server. One place that decides whether a tool call happens.</tspan></text>
  <rect x="40" y="150" width="350" height="190" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Step 1 · Declare</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Paste a URL or a command</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Pick transport: stdio, SSE,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">streamable HTTP</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Choose owner org unit,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">environments, credential</tspan></text>
  <rect x="410" y="150" width="350" height="190" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="162" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="422" dy="13.6" xml:space="preserve">Step 2 · Discover</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="422" dy="11.049999999999999" xml:space="preserve">Worker connects and lists</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">tools, resources, prompts</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">Stores an immutable snapshot</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">with a capability digest</tspan><tspan x="422" dy="18.849999999999998" xml:space="preserve">Health + latency recorded</tspan></text>
  <rect x="780" y="150" width="350" height="190" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="162" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="792" dy="13.6" xml:space="preserve">Step 3 · Classify</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="792" dy="11.049999999999999" xml:space="preserve">Declared hints kept separately</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">from verified findings</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">Set risk, write, irreversible,</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">data classes, argument rules</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">Templates pre-fill; a human confirms</tspan></text>
  <rect x="1150" y="150" width="350" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="162" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1162" dy="13.6" xml:space="preserve">Publish</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1162" dy="11.049999999999999" xml:space="preserve">Approve the snapshot</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">Grant subjects</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">Console emits client config</tspan><tspan x="1162" dy="18.849999999999998" xml:space="preserve">Preflight proves it works</tspan></text>
  <line x1="390" y1="245" x2="410" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="760" y1="245" x2="780" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1130" y1="245" x2="1150" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="400" width="700" height="262" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="412" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">tools/call — the checks, in order, all fail closed</tspan></text>
  <text y="442" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">1  platform key valid, not revoked, scope mcp:invoke</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">2  server approved, not quarantined, environment matches</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">3  a live grant exists for this subject and this capability</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">4  the approved snapshot is the one pinned by the grant (no substitution)</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">5  arguments validate against the declared schema</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">6  argument rules pass: repo not in the protected set, SQL verb allowed,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">   path inside the allowed root, blast radius under the cap</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">7  input scan: no secret or PII leaves in the arguments</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">8  rate + concurrency budget for this subject</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">9  verified write or irreversible → approval token required</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">10 dispatch, then scan the response before it returns to the model</tspan></text>
  <rect x="780" y="400" width="720" height="224" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="412" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="792" dy="13.6" xml:space="preserve">tools/list — filtered, because absence is the best deny</tspan></text>
  <text y="442" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="792" dy="11.049999999999999" xml:space="preserve">A caller is shown only the capabilities they hold a grant for, from the pinned</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">snapshot. A tool they cannot use does not appear, so the model never proposes it</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">and the developer never sees a mysterious refusal.</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve"></tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">The same filter governs the registry itself: a member with no grant cannot see the</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">server exists. Discovery of the estate is a privilege (registry:read_all), not a default.</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve"></tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">tools/call never trusts the list. A client that fabricates a tool name is re-checked</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">against grants, so a patched or malicious client gains nothing.</tspan></text>
  <rect x="40" y="700" width="460" height="168" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="712" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Drift and rug-pull</tspan></text>
  <text y="742" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Rediscovery compares digests.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">New or changed tool → stays invisible,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">raises a review item.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Removed tool → grant flagged, not deleted.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Definition changed under an approved name</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">→ server moves to in_review automatically.</tspan></text>
  <rect x="520" y="700" width="460" height="149" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="712" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="532" dy="13.6" xml:space="preserve">Kill switch</tspan></text>
  <text y="742" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="532" dy="11.049999999999999" xml:space="preserve">Quarantine takes effect within one cache TTL</tspan><tspan x="532" dy="18.849999999999998" xml:space="preserve">(≤ 5 s) for every caller and environment.</tspan><tspan x="532" dy="18.849999999999998" xml:space="preserve">Reason and actor are recorded; release is a</tspan><tspan x="532" dy="18.849999999999998" xml:space="preserve">separate permission from quarantine.</tspan><tspan x="532" dy="18.849999999999998" xml:space="preserve">Per-subject revoke is instant and audited.</tspan></text>
  <rect x="1000" y="700" width="500" height="149" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="712" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1012" dy="13.6" xml:space="preserve">What every call leaves behind</tspan></text>
  <text y="742" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1012" dy="11.049999999999999" xml:space="preserve">member · service identity · agent · session</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">server · tool · argument digest (not the arguments)</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">decision · reason code · risk · approval id</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">latency · bytes · upstream status</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">graph edges: member → agent → server → tool → resource</tspan></text>
  <rect x="40" y="940" width="1460" height="127" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="952" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">Why enforcement cannot live in the client</tspan></text>
  <text y="979" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Cursor's MCP allowlist, Claude Code's permission rules and MDM-delivered files are all useful defence in depth, and we should</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">generate them. None of them is a control we can attest to: they run on a machine the user administers, and the model itself</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">chooses which tool to invoke with which arguments. The only place a customer can be told 'this cannot happen' is the gateway</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">that owns the URL and holds the upstream credential. That is why the upstream credential must never reach the client.</tspan></text>
</svg>
