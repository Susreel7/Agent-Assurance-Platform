<svg xmlns="http://www.w3.org/2000/svg" width="2940" height="865" viewBox="0 0 2940 865">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
    <marker id="head-e03131" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#e03131"/></marker>
    <marker id="head-f08c00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#f08c00"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">05 · Model request lifecycle</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">Nine steps, all in the data plane. Target: under 12 ms of added policy overhead at p95, excluding provider time.</tspan></text>
  <rect x="40" y="150" width="300" height="190" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">1 · Terminate</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">OpenAI /v1/chat/completions</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">OpenAI /v1/responses</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Anthropic /v1/messages</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Gemini :generateContent</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Streaming passthrough</tspan></text>
  <rect x="360" y="150" width="300" height="190" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="372" dy="13.6" xml:space="preserve">2 · Authenticate</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="372" dy="11.049999999999999" xml:space="preserve">Platform key → service identity</tspan><tspan x="372" dy="18.849999999999998" xml:space="preserve">acts_for member · agent · project</tspan><tspan x="372" dy="18.849999999999998" xml:space="preserve">environment · scopes</tspan><tspan x="372" dy="18.849999999999998" xml:space="preserve">Unknown key → 401, no upstream</tspan></text>
  <rect x="680" y="150" width="300" height="190" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="162" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="692" dy="13.6" xml:space="preserve">3 · Resolve subject</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="692" dy="11.049999999999999" xml:space="preserve">member + org units</tspan><tspan x="692" dy="18.849999999999998" xml:space="preserve">grants + effective policy</tspan><tspan x="692" dy="18.849999999999998" xml:space="preserve">budget state · rate state</tspan><tspan x="692" dy="18.849999999999998" xml:space="preserve">All from local cache (≤5 s TTL)</tspan></text>
  <rect x="1000" y="150" width="300" height="190" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="162" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1012" dy="13.6" xml:space="preserve">4 · Inspect input</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1012" dy="11.049999999999999" xml:space="preserve">Secrets · PII · source code</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">Classify to data class</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">Action: allow / mask / tokenize /</tspan><tspan x="1012" dy="18.849999999999998" xml:space="preserve">block / route-internal / approve</tspan></text>
  <rect x="1320" y="150" width="300" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="162" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1332" dy="13.6" xml:space="preserve">5 · Select model</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1332" dy="11.049999999999999" xml:space="preserve">Requested alias or mode</tspan><tspan x="1332" dy="18.849999999999998" xml:space="preserve">Filter endpoints by residency,</tspan><tspan x="1332" dy="18.849999999999998" xml:space="preserve">capability, budget, health</tspan><tspan x="1332" dy="18.849999999999998" xml:space="preserve">Weighted pick inside the filter</tspan></text>
  <rect x="1640" y="150" width="300" height="190" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="162" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1652" dy="13.6" xml:space="preserve">6 · Dispatch</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1652" dy="11.049999999999999" xml:space="preserve">Provider adapter translates</tspan><tspan x="1652" dy="18.849999999999998" xml:space="preserve">Credentials from vault, never client</tspan><tspan x="1652" dy="18.849999999999998" xml:space="preserve">Retry + failover inside group</tspan><tspan x="1652" dy="18.849999999999998" xml:space="preserve">Circuit breaker per endpoint</tspan></text>
  <rect x="1960" y="150" width="300" height="190" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="162" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1972" dy="13.6" xml:space="preserve">7 · Inspect output</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1972" dy="11.049999999999999" xml:space="preserve">Secret + PII scan on response</tspan><tspan x="1972" dy="18.849999999999998" xml:space="preserve">Detokenize inside boundary</tspan><tspan x="1972" dy="18.849999999999998" xml:space="preserve">Injection / exfil heuristics</tspan></text>
  <rect x="2280" y="150" width="300" height="190" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="162" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="2292" dy="13.6" xml:space="preserve">8 · Account</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="2292" dy="11.049999999999999" xml:space="preserve">Tokens in/out from provider</tspan><tspan x="2292" dy="18.849999999999998" xml:space="preserve">cost = tokens × effective price</tspan><tspan x="2292" dy="18.849999999999998" xml:space="preserve">Budget decrement, atomic</tspan></text>
  <rect x="2600" y="150" width="300" height="190" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="162" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="2612" dy="13.6" xml:space="preserve">9 · Emit</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="2612" dy="11.049999999999999" xml:space="preserve">One ai_event with decision,</tspan><tspan x="2612" dy="18.849999999999998" xml:space="preserve">reason code, finding kinds,</tspan><tspan x="2612" dy="18.849999999999998" xml:space="preserve">payload digest + local body ref</tspan></text>
  <line x1="340" y1="245" x2="360" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="660" y1="245" x2="680" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="980" y1="245" x2="1000" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1300" y1="245" x2="1320" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1620" y1="245" x2="1640" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1940" y1="245" x2="1960" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="2260" y1="245" x2="2280" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="2580" y1="245" x2="2600" y2="245" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="400" width="620" height="149" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="412" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Deny path — always explains itself</tspan></text>
  <text y="442" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">HTTP 403 with a machine reason code and a human sentence:</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  reason: data_class_blocked · policy: DATA-004 · class: customer_pii</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  destination: anthropic/eu-central-1 · alternative alias: aap-internal-secure</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">The same text appears in the console, the audit row and the client error.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">A developer who is blocked must know what to do next without filing a ticket.</tspan></text>
  <rect x="700" y="400" width="620" height="130" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="412" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="712" dy="13.6" xml:space="preserve">Approval path — never a dead end</tspan></text>
  <text y="442" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="712" dy="11.049999999999999" xml:space="preserve">A high-risk request returns 409 with an approval id and a resume token.</tspan><tspan x="712" dy="18.849999999999998" xml:space="preserve">Approver is notified in the console and over Slack/Teams/email webhook.</tspan><tspan x="712" dy="18.849999999999998" xml:space="preserve">On approval the client retries with the token; the gateway re-checks policy</tspan><tspan x="712" dy="18.849999999999998" xml:space="preserve">(state can have changed) and then dispatches. Tokens are single use and expire.</tspan></text>
  <rect x="40" y="620" width="1280" height="205" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="632" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Residency — the part that is usually claimed dishonestly</tspan></text>
  <text y="662" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">A model name carries no location. Processing location is a property of the endpoint you call:</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  Azure Foundry    GlobalStandard → any Azure region · DataZoneStandard → US/EU/APAC zone · Standard → the deployment region only</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  AWS Bedrock      in-region endpoint → that region · geographic inference profile → within the geography · global profile → worldwide</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  Vertex AI        regional endpoint → that location · global endpoint may route elsewhere</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  OpenAI direct    residency depends on the account tier and must be configured, not assumed</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Therefore the gateway stores residency on model_endpoints (region, zone, residency_class, deployment_ref, evidence_ref, attested_at),</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">and policy filters on that column. An endpoint that cannot be attested is labelled global_unpinned and is unusable for regulated classes.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">The console shows 'attested' with its evidence, or 'unverified'. It never renders a region we merely inferred as if it were proof.</tspan></text>
  <line x1="1150" y1="340" x2="350" y2="400" stroke="#e03131" stroke-width="1.4" marker-end="url(#head-e03131)"/>
  <line x1="1470" y1="340" x2="1010" y2="400" stroke="#f08c00" stroke-width="1.4" marker-end="url(#head-f08c00)"/>
</svg>
