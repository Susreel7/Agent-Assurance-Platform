<svg xmlns="http://www.w3.org/2000/svg" width="2015" height="829" viewBox="0 0 2015 829">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">10 · Who sees which dashboard</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">Same data, five products. What changes is the scope filter and the payload permission — never a second copy of the numbers.</tspan></text>
  <rect x="40" y="150" width="285" height="220" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="162" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">Member (everyone)</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">My AI usage: requests, tokens, cost</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">My tool calls and what they touched</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">My denials, with the reason and the</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">fix</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">My prompt hygiene score</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Cannot see another person, at all</tspan></text>
  <rect x="335" y="150" width="285" height="220" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="347" dy="12.75" xml:space="preserve">DL admin / manager</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="347" dy="11.049999999999999" xml:space="preserve">Subtree rollups: cost, tokens,</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">adoption</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">Ranked members, tools, models</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">Denials and incidents in the subtree</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">Budget burn-down + forecast</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">Drill to one member; no prompt bodies</tspan></text>
  <rect x="630" y="150" width="285" height="220" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="162" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="642" dy="12.75" xml:space="preserve">Security admin</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="642" dy="11.049999999999999" xml:space="preserve">Every denial, incident and risk case</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Data-class flows by destination</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Agent and MCP blast radius</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Attack-path queries on the graph</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Payload reveal only with approval</tspan></text>
  <rect x="925" y="150" width="285" height="220" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="162" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="937" dy="12.75" xml:space="preserve">Platform / finance</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="937" dy="11.049999999999999" xml:space="preserve">Cost by org unit, model, provider</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">Alias split versus target</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">Endpoint health, latency, breakers</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">Price-book changes and corrections</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">No identifiable prompt content</tspan></text>
  <rect x="1220" y="150" width="285" height="220" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="162" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="1232" dy="12.75" xml:space="preserve">Auditor</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1232" dy="11.049999999999999" xml:space="preserve">Immutable audit stream</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Evidence packs with integrity proofs</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Policy versions and who changed them</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Approval history</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Read-only, and cannot change scope</tspan></text>
  <rect x="40" y="420" width="1420" height="149" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="432" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">One aggregate service behind all five</tspan></text>
  <text y="462" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">GET /v1/insights/usage?group_by=org_unit|member|model|tool&amp;window=…&amp;scope=…</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">The scope argument is intersected with the caller's visibility set on the server. A caller who asks for an org unit they</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">cannot see gets 403 with reason scope_outside_grant — never an empty chart, which would read as 'no usage'.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Payload fields are omitted unless the caller holds payload:reveal and a valid approval; the response says which fields</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">were withheld and why, so the UI can render a lock with an explanation instead of a blank cell.</tspan></text>
  <line x1="182.5" y1="370" x2="750" y2="420" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#head-1e1e1e)"/>
  <line x1="477.5" y1="370" x2="750" y2="420" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#head-1e1e1e)"/>
  <line x1="772.5" y1="370" x2="750" y2="420" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#head-1e1e1e)"/>
  <line x1="1067.5" y1="370" x2="750" y2="420" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#head-1e1e1e)"/>
  <line x1="1362.5" y1="370" x2="750" y2="420" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="640" width="700" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="652" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Navigation is server-driven</tspan></text>
  <text y="682" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">The bootstrap response returns the navigation manifest for this caller.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">A module the caller cannot use is absent, not present-and-broken.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">This removes the whole class of 'click a tab, get 403, see a red box'.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Deep links to a hidden module render a purposeful 'request access' page.</tspan></text>
  <rect x="780" y="640" width="720" height="149" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.4"/>
  <text y="652" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="792" dy="13.6" xml:space="preserve">Every screen ships four states</tspan></text>
  <text y="682" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="792" dy="11.049999999999999" xml:space="preserve">loading   skeleton matching the final layout, no spinner-in-a-box</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">empty     what this screen is for, and the one action that fills it</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">error     the reason code, the human sentence, and a retry that works</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">data      the thing itself, with the freshness of the numbers stated</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">A screen without all four is not done, and the UI test asserts each one.</tspan></text>
</svg>
