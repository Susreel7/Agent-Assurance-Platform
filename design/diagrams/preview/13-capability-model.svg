<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="887" viewBox="0 0 1480 887">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">13 · Capability governance</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">MCP becomes one row in a registry of capability kinds, not the architecture. The chain below is identical for every kind.</tspan></text>
  <rect x="40" y="160" width="232" height="200" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="172" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">1 · definition</tspan></text>
  <text y="200" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">one named thing an agent</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">can do</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">kind · id · source · verbs</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">argument shape</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">digest of its description —</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">that text is attacker input</tspan></text>
  <rect x="332" y="160" width="232" height="200" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="172" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="344" dy="12.75" xml:space="preserve">2 · risk</tspan></text>
  <text y="200" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="344" dy="11.049999999999999" xml:space="preserve">ours first, yours final</tspan><tspan x="344" dy="18.849999999999998" xml:space="preserve">write? destructive?</tspan><tspan x="344" dy="18.849999999999998" xml:space="preserve">reversible? audience?</tspan><tspan x="344" dy="18.849999999999998" xml:space="preserve">data classes reachable</tspan><tspan x="344" dy="18.849999999999998" xml:space="preserve">blast radius if confused</tspan><tspan x="344" dy="18.849999999999998" xml:space="preserve">your override always wins</tspan></text>
  <rect x="624" y="160" width="232" height="200" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="172" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="636" dy="12.75" xml:space="preserve">3 · grant</tspan></text>
  <text y="200" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="636" dy="11.049999999999999" xml:space="preserve">who may invoke, and how</tspan><tspan x="636" dy="18.849999999999998" xml:space="preserve">subject · selector</tspan><tspan x="636" dy="18.849999999999998" xml:space="preserve">argument rules</tspan><tspan x="636" dy="18.849999999999998" xml:space="preserve">max_taint</tspan><tspan x="636" dy="18.849999999999998" xml:space="preserve">expiry — always</tspan><tspan x="636" dy="18.849999999999998" xml:space="preserve">no permanent exception</tspan></text>
  <rect x="916" y="160" width="232" height="200" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="172" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="928" dy="12.75" xml:space="preserve">4 · invocation</tspan></text>
  <text y="200" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="928" dy="11.049999999999999" xml:space="preserve">ordered, at call time</tspan><tspan x="928" dy="18.849999999999998" xml:space="preserve">instance → delegation →</tspan><tspan x="928" dy="18.849999999999998" xml:space="preserve">grant → taint → args →</tspan><tspan x="928" dy="18.849999999999998" xml:space="preserve">credential lease</tspan><tspan x="928" dy="18.849999999999998" xml:space="preserve">unparseable arg = deny</tspan><tspan x="928" dy="18.849999999999998" xml:space="preserve">decision carries its grade</tspan></text>
  <rect x="1208" y="160" width="232" height="200" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="172" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="1220" dy="12.75" xml:space="preserve">5 · evidence</tspan></text>
  <text y="200" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1220" dy="11.049999999999999" xml:space="preserve">one envelope aap.action.v1</tspan><tspan x="1220" dy="18.849999999999998" xml:space="preserve">identity chain + decision</tspan><tspan x="1220" dy="18.849999999999998" xml:space="preserve">facets, never raw args</tspan><tspan x="1220" dy="18.849999999999998" xml:space="preserve">hash-chained; gaps show</tspan><tspan x="1220" dy="18.849999999999998" xml:space="preserve">joins to the code change</tspan></text>
  <line x1="272" y1="260" x2="332" y2="260" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="564" y1="260" x2="624" y2="260" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="856" y1="260" x2="916" y2="260" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1148" y1="260" x2="1208" y2="260" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="420" width="1400" height="262" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.4"/>
  <text y="432" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">The registry of kinds — MCP is one row in it, not the model itself</tspan></text>
  <text y="462" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">kind             what it is                           where we can stand             why it matters</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">mcp.tool         a tool on an MCP server              in path                        the 2025 design assumed this was all of it</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">shell.exec       Bash, Run, a terminal                client hook, sandbox           step 4 of the reference incident</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">net.http         curl, fetch, a raw SDK call          client hook, egress proxy      step 5 — the exfiltration path nobody models</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">fs.read          reading files and secrets            client hook                    step 3 — .env, ~/.aws, ~/.ssh, CI tokens</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">fs.write         writing files                        client hook                    persistence and configuration poisoning</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">vcs.write        commit, push, open a PR, merge       provider API + hook            the join to the SDLC record</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">cloud.api        AWS / Azure / GCP control plane      credential scope               often grade C when nothing else works</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">db.query         SQL and warehouse access             proxy                          read scope, row limits, masking</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">agent.delegate   hand work to a sub-agent             in path                        depth cap; authority only ever narrows</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">memory.write     what the agent is allowed to keep    in path                        poisoning and cross-session leakage</tspan></text>
  <rect x="40" y="720" width="1400" height="127" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="732" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">Why the abstraction moved up a level</tspan></text>
  <text y="759" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">On 25 April 2026 an agent deleted a production database and its volume-level backups in nine seconds. The path was: read a</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">long-lived token off the workspace filesystem, build a curl command, call a GraphQL mutation. Three capability kinds, none of</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">them MCP. An MCP gateway was not on that path and neither was a model gateway. Governing the kind rather than the protocol is</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">the difference between a control and a demonstration.</tspan></text>
</svg>
