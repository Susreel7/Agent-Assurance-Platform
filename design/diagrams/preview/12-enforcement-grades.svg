<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="807" viewBox="0 0 1480 807">
  <defs>
    
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">12 · Enforcement grades</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">Every control we ship carries a grade, and every number in the console says which grade it came from. This is the honesty mechanism the product is sold on.</tspan></text>
  <rect x="40" y="150" width="272" height="200" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="162" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">A · mediated</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">the call cannot happen</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">without passing through us</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve"></tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">MCP tools via our gateway</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">CI and in-house agents</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">in-path egress proxy</tspan></text>
  <rect x="322" y="150" width="272" height="200" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="334" dy="12.75" xml:space="preserve">B · interposed</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="334" dy="11.049999999999999" xml:space="preserve">the client asks us before</tspan><tspan x="334" dy="18.849999999999998" xml:space="preserve">it acts, and honours a veto</tspan><tspan x="334" dy="18.849999999999998" xml:space="preserve"></tspan><tspan x="334" dy="18.849999999999998" xml:space="preserve">Claude Code PreToolUse [B-31]</tspan><tspan x="334" dy="18.849999999999998" xml:space="preserve">Cursor hooks [B-33]</tspan><tspan x="334" dy="18.849999999999998" xml:space="preserve">bypass: run another client</tspan></text>
  <rect x="604" y="150" width="272" height="200" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="162" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="616" dy="12.75" xml:space="preserve">C · attested</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="616" dy="11.049999999999999" xml:space="preserve">your vendor enforces it and</tspan><tspan x="616" dy="18.849999999999998" xml:space="preserve">we verify it is still set</tspan><tspan x="616" dy="18.849999999999998" xml:space="preserve"></tspan><tspan x="616" dy="18.849999999999998" xml:space="preserve">Cursor enterprise MCP</tspan><tspan x="616" dy="18.849999999999998" xml:space="preserve">allowlist [B-42]</tspan><tspan x="616" dy="18.849999999999998" xml:space="preserve">Copilot AI Controls [B-36]</tspan></text>
  <rect x="886" y="150" width="272" height="200" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="162" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="898" dy="12.75" xml:space="preserve">D · observed</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="898" dy="11.049999999999999" xml:space="preserve">we learn about it afterwards</tspan><tspan x="898" dy="18.849999999999998" xml:space="preserve"></tspan><tspan x="898" dy="18.849999999999998" xml:space="preserve">Cursor prompts resolve in</tspan><tspan x="898" dy="18.849999999999998" xml:space="preserve">their cloud before they</tspan><tspan x="898" dy="18.849999999999998" xml:space="preserve">reach us [B-41]</tspan><tspan x="898" dy="18.849999999999998" xml:space="preserve">evidence, not prevention</tspan></text>
  <rect x="1168" y="150" width="272" height="200" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="162" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="1180" dy="12.75" xml:space="preserve">E · uncovered</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1180" dy="11.049999999999999" xml:space="preserve">we cannot see it and cannot</tspan><tspan x="1180" dy="18.849999999999998" xml:space="preserve">stop it</tspan><tspan x="1180" dy="18.849999999999998" xml:space="preserve"></tspan><tspan x="1180" dy="18.849999999999998" xml:space="preserve">a personal key on an</tspan><tspan x="1180" dy="18.849999999999998" xml:space="preserve">unmanaged laptop, a local</tspan><tspan x="1180" dy="18.849999999999998" xml:space="preserve">model, another client</tspan></text>
  <rect x="40" y="400" width="1400" height="186" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.4"/>
  <text y="412" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">What each client can actually be held to — researched September 2026</tspan></text>
  <text y="442" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">client            model traffic          tool calls                     configuration          usage</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Claude Code       A  our base URL        A  MCP  +  B  hooks            C  managed settings    D  OTLP</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Cursor            D  their cloud only    A  MCP  +  B  hooks            C  dashboard policy    D  Admin API</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Copilot           E  no in-app redirect  C  MCP policy                  C  AI Controls         D  metrics API</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Codex CLI         A  openai_base_url     B  tool_decision               E  no vendor MDM       D  OTEL</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Gemini CLI        A  base URL            B  sandbox                     C  system settings     D</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">CI and in-house   A                      A                              A  your infrastructure A</tspan></text>
  <rect x="40" y="640" width="1400" height="127" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="652" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">The rule this diagram exists to enforce</tspan></text>
  <text y="679" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">A coverage figure without a denominator does not ship. &quot;1,284 actions governed&quot; is not a number; &quot;1,284 of an estimated 1,610,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">of which 402 are grade D observation only and 180 are grade E we cannot see&quot; is a number. The grade is a mandatory column on</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">every decision row, and a row whose grade is unknown is counted as E. This is the single habit that survives first contact with a</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">CISO who has already been sold a control that turned out to be a dashboard.</tspan></text>
</svg>
