<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1047" viewBox="0 0 1560 1047">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">09 · Activity pipeline and scale</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">Design point: 100k governed requests per 30 minutes sustained (~56/s), 10× burst, ~4 tool calls each → ~3k events/s peak, ~25M events/day.</tspan></text>
  <rect x="40" y="160" width="280" height="149" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="172" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Emit</tspan></text>
  <text y="202" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Gateway writes one envelope</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">per decision, into a bounded</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">in-process ring buffer</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Telemetry never blocks or fails</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">a policy decision — it sheds</tspan></text>
  <rect x="340" y="160" width="280" height="149" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="172" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="352" dy="13.6" xml:space="preserve">Collect</tspan></text>
  <text y="202" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="352" dy="11.049999999999999" xml:space="preserve">Batched, compressed, signed</tspan><tspan x="352" dy="18.849999999999998" xml:space="preserve">At-least-once with event_id</tspan><tspan x="352" dy="18.849999999999998" xml:space="preserve">Disk spool survives restarts</tspan><tspan x="352" dy="18.849999999999998" xml:space="preserve">Backpressure → sample the</tspan><tspan x="352" dy="18.849999999999998" xml:space="preserve">allow path, keep every deny</tspan></text>
  <rect x="640" y="160" width="280" height="149" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="172" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="652" dy="13.6" xml:space="preserve">Queue</tspan></text>
  <text y="202" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="652" dy="11.049999999999999" xml:space="preserve">Kafka / Redpanda</tspan><tspan x="652" dy="18.849999999999998" xml:space="preserve">Partition by account_id</tspan><tspan x="652" dy="18.849999999999998" xml:space="preserve">Ordering per session only</tspan><tspan x="652" dy="18.849999999999998" xml:space="preserve">Retention long enough to</tspan><tspan x="652" dy="18.849999999999998" xml:space="preserve">replay a bad consumer</tspan></text>
  <rect x="940" y="160" width="280" height="168" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="172" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="952" dy="13.6" xml:space="preserve">Consumers</tspan></text>
  <text y="202" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="952" dy="11.049999999999999" xml:space="preserve">a raw insert</tspan><tspan x="952" dy="18.849999999999998" xml:space="preserve">b rollup aggregation</tspan><tspan x="952" dy="18.849999999999998" xml:space="preserve">c risk + alerting</tspan><tspan x="952" dy="18.849999999999998" xml:space="preserve">d graph projection</tspan><tspan x="952" dy="18.849999999999998" xml:space="preserve">Independent offsets, so one</tspan><tspan x="952" dy="18.849999999999998" xml:space="preserve">slow consumer stalls nothing</tspan></text>
  <rect x="1240" y="160" width="280" height="168" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="172" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1252" dy="13.6" xml:space="preserve">Store</tspan></text>
  <text y="202" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1252" dy="11.049999999999999" xml:space="preserve">ClickHouse, day partitions</tspan><tspan x="1252" dy="18.849999999999998" xml:space="preserve">ReplacingMergeTree on event_id</tspan><tspan x="1252" dy="18.849999999999998" xml:space="preserve">ZSTD, low-cardinality dicts</tspan><tspan x="1252" dy="18.849999999999998" xml:space="preserve">TTL: 30d hot → 400d cold</tspan><tspan x="1252" dy="18.849999999999998" xml:space="preserve">Payload bodies stay in the</tspan><tspan x="1252" dy="18.849999999999998" xml:space="preserve">customer object store</tspan></text>
  <line x1="320" y1="234.5" x2="340" y2="234.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="620" y1="234.5" x2="640" y2="234.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="920" y1="234.5" x2="940" y2="244" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1220" y1="244" x2="1240" y2="244" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="430" width="720" height="168" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="442" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Read path — dashboards never touch raw events</tspan></text>
  <text y="472" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Every console query hits a rollup keyed by (account, bucket, org_path, member,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">agent, alias, server, tool, decision). A manager view is a path prefix scan.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Raw events are reachable only from a drill-down that already names a narrow</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">window and one subject, and that read is itself audited.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Aggregate endpoints are cursor-paginated and return totals from sketches, never</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">from count(*) over a partition.</tspan></text>
  <rect x="800" y="430" width="700" height="186" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="442" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="812" dy="13.6" xml:space="preserve">Algorithms, and why each one</tspan></text>
  <text y="472" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="812" dy="11.049999999999999" xml:space="preserve">t-digest        p50/p95/p99 latency mergeable across buckets</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">HyperLogLog     unique active people per org unit without a distinct scan</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">count-min       top-K tools and models under a fixed memory budget</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">EWMA + MAD      per-subject baselines for anomaly alerts, robust to outliers</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">closure table   hierarchy reads in one indexed join</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">token bucket    per-subject rate limits in Redis, one round trip</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">Bloom filter    de-duplicate secret fingerprints without storing secrets</tspan></text>
  <rect x="40" y="660" width="720" height="130" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="672" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Cardinality discipline (the thing that actually kills these systems)</tspan></text>
  <text y="702" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Dimensions are enumerable or bucketed. member, agent, alias, server, tool, decision,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">reason_code: enumerable. Anything free-form — prompt text, request id, argument values —</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">is never a rollup dimension. Beyond top-N per bucket, the tail folds into 'other' and the</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">exact answer stays available in raw events for the retention window.</tspan></text>
  <rect x="800" y="660" width="700" height="168" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="672" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="812" dy="13.6" xml:space="preserve">Cost and token accounting</tspan></text>
  <text y="702" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="812" dy="11.049999999999999" xml:space="preserve">Tokens come from the provider response; when a provider omits them we record</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">measured=false and estimate, and the UI says which.</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">cost_micros = tokens × effective price from an effective-dated price book, computed</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">at ingest and stored, so a later price change cannot silently rewrite history.</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">A correction job recomputes a window and writes a new version with a reason.</tspan><tspan x="812" dy="18.849999999999998" xml:space="preserve">Budgets decrement in Redis for enforcement and reconcile against ClickHouse hourly.</tspan></text>
  <rect x="40" y="880" width="1460" height="127" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="892" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">Capacity sizing to state in the proposal</tspan></text>
  <text y="919" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">~25M events/day at ~350 bytes compressed ≈ 9 GB/day raw, ~1 GB/day after rollup, well inside a three-node ClickHouse cluster.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Gateway cost is dominated by inspection, not policy: budget 4–8 ms for DLP on a 32 KB prompt and cache compiled rules per policy</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">version. Policy evaluation is a hash lookup plus a bounded rule walk, sub-millisecond, and must stay that way — no database call</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">on the request path, only the local cache with a 5 second TTL and an explicit invalidation channel.</tspan></text>
</svg>
