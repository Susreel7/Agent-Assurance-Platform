  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">03 · Org hierarchy, distribution lists and who sees what</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">One tree, one closure table, one visibility rule. tens of DLs with hundreds of people each is the shape this must fit.</tspan></text>
  <rect x="620" y="140" width="300" height="92" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="152" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="632" dy="13.6" xml:space="preserve">account</tspan></text>
  <text y="182" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="632" dy="11.049999999999999" xml:space="preserve">one customer · tenant boundary</tspan><tspan x="632" dy="18.849999999999998" xml:space="preserve">residency + retention defaults</tspan></text>
  <rect x="300" y="290" width="280" height="111" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="302" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="312" dy="13.6" xml:space="preserve">org_unit · business unit</tspan></text>
  <text y="332" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="312" dy="11.049999999999999" xml:space="preserve">kind = business_unit</tspan><tspan x="312" dy="18.849999999999998" xml:space="preserve">manager: VP</tspan><tspan x="312" dy="18.849999999999998" xml:space="preserve">sees whole subtree</tspan></text>
  <rect x="960" y="290" width="280" height="111" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="302" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="972" dy="13.6" xml:space="preserve">org_unit · business unit</tspan></text>
  <text y="332" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="972" dy="11.049999999999999" xml:space="preserve">kind = business_unit</tspan><tspan x="972" dy="18.849999999999998" xml:space="preserve">manager: VP</tspan><tspan x="972" dy="18.849999999999998" xml:space="preserve">sees whole subtree</tspan></text>
  <rect x="120" y="450" width="300" height="130" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="462" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="132" dy="13.6" xml:space="preserve">org_unit · DL ide-users</tspan></text>
  <text y="492" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="132" dy="11.049999999999999" xml:space="preserve">kind = distribution_list</tspan><tspan x="132" dy="18.849999999999998" xml:space="preserve">source = directory_sync</tspan><tspan x="132" dy="18.849999999999998" xml:space="preserve">external_ref = DL object id</tspan><tspan x="132" dy="18.849999999999998" xml:space="preserve">213 members · 1 DL admin</tspan></text>
  <rect x="450" y="450" width="300" height="111" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="462" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="462" dy="13.6" xml:space="preserve">org_unit · DL data-platform</tspan></text>
  <text y="492" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="462" dy="11.049999999999999" xml:space="preserve">kind = distribution_list</tspan><tspan x="462" dy="18.849999999999998" xml:space="preserve">source = scim</tspan><tspan x="462" dy="18.849999999999998" xml:space="preserve">184 members · 2 DL admins</tspan></text>
  <rect x="960" y="450" width="300" height="111" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="462" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="972" dy="13.6" xml:space="preserve">org_unit · DL … (30+ total)</tspan></text>
  <text y="492" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="972" dy="11.049999999999999" xml:space="preserve">One row per DL</tspan><tspan x="972" dy="18.849999999999998" xml:space="preserve">Nesting allowed</tspan><tspan x="972" dy="18.849999999999998" xml:space="preserve">A member may sit in several</tspan></text>
  <rect x="120" y="660" width="300" height="111" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="672" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="132" dy="13.6" xml:space="preserve">member</tspan></text>
  <text y="702" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="132" dy="11.049999999999999" xml:space="preserve">person · one row per employee</tspan><tspan x="132" dy="18.849999999999998" xml:space="preserve">status: invited/active/suspended</tspan><tspan x="132" dy="18.849999999999998" xml:space="preserve">primary_org_unit + memberships</tspan></text>
  <rect x="450" y="660" width="300" height="111" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="672" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="462" dy="13.6" xml:space="preserve">member_identities</tspan></text>
  <text y="702" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="462" dy="11.049999999999999" xml:space="preserve">issuer + subject (unique)</tspan><tspan x="462" dy="18.849999999999998" xml:space="preserve">email_verified · mfa</tspan><tspan x="462" dy="18.849999999999998" xml:space="preserve">many identities → one member</tspan></text>
  <rect x="780" y="660" width="300" height="111" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="672" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="792" dy="13.6" xml:space="preserve">service_identities</tspan></text>
  <text y="702" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="792" dy="11.049999999999999" xml:space="preserve">platform keys · agents · CI</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">acts_for_member_id</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">project + environment + scopes</tspan></text>
  <rect x="1110" y="660" width="300" height="111" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="672" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1122" dy="13.6" xml:space="preserve">agents</tspan></text>
  <text y="702" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1122" dy="11.049999999999999" xml:space="preserve">registered agent or client</tspan><tspan x="1122" dy="18.849999999999998" xml:space="preserve">owner_member_id + org_unit</tspan><tspan x="1122" dy="18.849999999999998" xml:space="preserve">cursor / claude-code / custom</tspan></text>
  <line x1="620" y1="186" x2="580" y2="345.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="920" y1="186" x2="960" y2="345.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="300" y1="345.5" x2="420" y2="515" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="440" y1="401" x2="600" y2="450" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1100" y1="401" x2="1110" y2="450" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="270" y1="580" x2="270" y2="660" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="420" y1="715.5" x2="450" y2="715.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="270" y1="771" x2="930" y2="771" stroke="#1e1e1e" stroke-width="1.4" stroke-dasharray="7 5" marker-end="url(#head-1e1e1e)"/>
  <text y="788" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="12"><tspan x="573.5" dy="10.2" xml:space="preserve">acts_for</tspan></text>
  <line x1="1080" y1="715.5" x2="1110" y2="715.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="860" width="700" height="130" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="872" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Hierarchy storage — closure table, not recursive queries at read time</tspan></text>
  <text y="902" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">org_unit_closure(ancestor_id, descendant_id, depth)   one row per ancestor pair</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">org_units.path  ltree/text   '/acct/bu/dl'  for prefix filters and index scans</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Rollup rows carry org_path so a manager view is a prefix match, not a join storm.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Reparenting rewrites closure + path for the moved subtree in one transaction.</tspan></text>
  <rect x="780" y="860" width="720" height="168" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="872" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="792" dy="13.6" xml:space="preserve">Visibility rule — one function, used by every query</tspan></text>
  <text y="902" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="792" dy="11.049999999999999" xml:space="preserve">visible_members(viewer) =</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">   {self}</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve"> ∪ {members of org units where viewer holds a grant with scope=org_unit and subtree=true}</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve"> ∪ {all members, when the viewer holds account-scoped activity:read_all}</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">Every activity, cost and risk query is filtered by this set. No endpoint accepts a</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">caller-supplied member filter without intersecting it with the caller's own scope.</tspan></text>
  <rect x="40" y="1110" width="1460" height="127" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="1122" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">Worked example — the DL case</tspan></text>
  <text y="1149" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">A DL admin on ide-users holds role dl_admin scoped to that org unit with subtree=true. They see those members' usage,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">cost, tool calls and denials, and can drill into any one of them; they see aggregate counts for the rest of the company</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">and nothing identifiable. A VP above them sees both DLs and the union. A member sees only themselves. Security admins</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">see every denial and incident company-wide but need a separate payload:reveal grant plus an approval to read any prompt.</tspan></text>
</svg>
