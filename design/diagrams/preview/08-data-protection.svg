<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="986" viewBox="0 0 1540 986">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">08 · Secrets and PII in prompts</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">Layered detection, an explicit action matrix, reversible tokens that never leave the customer boundary.</tspan></text>
  <rect x="40" y="150" width="340" height="300" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="162" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Detect (layered, cheap first)</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">1 literal + prefix scan: sk-, ghp_, AKIA,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  xoxb-, -----BEGIN, Bearer ey…</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">2 structural: Luhn, IBAN, NI/SSN, UUID,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  regex with checksum validation</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">3 entropy: base64/hex blocks over a</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  threshold, filtered by context</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">4 NER: person, address, phone, org</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">5 schema-aware: known column and table</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  names from the data catalogue</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">6 code-aware: secrets in diffs, .env,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">  connection strings, private keys</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Scan raw bytes and the JSON-decoded</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">values — escaping is a bypass otherwise.</tspan></text>
  <rect x="400" y="150" width="320" height="243" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="162" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="412" dy="13.6" xml:space="preserve">Classify</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="412" dy="11.049999999999999" xml:space="preserve">Finding → data class:</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">  secret_material</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">  customer_pii · employee_pii</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">  health · financial</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">  source_code · internal_doc</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">  regulated_record</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">Highest class wins for the request.</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">Confidence is kept, and low-confidence</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">findings can be set to annotate rather</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">than block so the tool stays usable.</tspan></text>
  <rect x="740" y="150" width="400" height="262" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="162" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="752" dy="13.6" xml:space="preserve">Act (per class, per destination)</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="752" dy="11.049999999999999" xml:space="preserve">allow              nothing found, or class permitted</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">annotate           record only, useful while tuning</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">mask irreversible ****, model loses the value</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">tokenize PERSON_1 / ACCT_7, reversible in boundary</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">route_internal     send to a self-hosted model instead</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">require_approval human releases it, with justification</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">block refuse, name the policy and an alternative</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve"></tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">secret_material is block or mask. Never tokenize a</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">credential: a reversible credential is still a</tspan><tspan x="752" dy="18.849999999999998" xml:space="preserve">credential.</tspan></text>
  <rect x="1160" y="150" width="340" height="205" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="162" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1172" dy="13.6" xml:space="preserve">Token vault (data plane only)</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1172" dy="11.049999999999999" xml:space="preserve">token → ciphertext, AEAD under the</tspan><tspan x="1172" dy="18.849999999999998" xml:space="preserve">customer KMS key, per-account key ring</tspan><tspan x="1172" dy="18.849999999999998" xml:space="preserve">Stable within a session so the model can</tspan><tspan x="1172" dy="18.849999999999998" xml:space="preserve">reason about 'the same person'</tspan><tspan x="1172" dy="18.849999999999998" xml:space="preserve">TTL measured in hours, then unrecoverable</tspan><tspan x="1172" dy="18.849999999999998" xml:space="preserve">Detokenize on the response path, inside</tspan><tspan x="1172" dy="18.849999999999998" xml:space="preserve">the boundary, before the client sees it</tspan><tspan x="1172" dy="18.849999999999998" xml:space="preserve">The control plane never receives the map</tspan></text>
  <line x1="380" y1="300" x2="400" y2="271.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="720" y1="271.5" x2="740" y2="281" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1140" y1="281" x2="1160" y2="252.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="560" width="1460" height="149" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="572" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Round trip with reversible tokens</tspan></text>
  <text y="602" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">developer prompt      &quot;summarise churn risk for John Smith, account 4471-2288&quot;</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">after inspection      &quot;summarise churn risk for &lt;PERSON_1&gt;, account &lt;ACCOUNT_1&gt;&quot;        ← what the provider receives</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">provider response     &quot;&lt;PERSON_1&gt; is high risk because account &lt;ACCOUNT_1&gt; …&quot;</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">after detokenisation  &quot;John Smith is high risk because account 4471-2288 …&quot;             ← what the developer receives</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">recorded              finding kinds, classes, counts, digests, decision, policy id — never the values</tspan></text>
  <rect x="40" y="760" width="700" height="168" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.4"/>
  <text y="772" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Stated limits — put these in the product, not only the docs</tspan></text>
  <text y="802" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Detection reduces risk; it does not prove absence. Names, addresses and</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">paraphrased secrets are missed by every detector, ours included.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">So the most sensitive classes must be policy-protected by destination</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">(route to an internal model) rather than by redaction confidence.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Every rule ships with a measured false-positive rate on the customer's own</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">traffic in annotate mode before it is allowed to block.</tspan></text>
  <rect x="780" y="760" width="720" height="186" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="772" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="792" dy="13.6" xml:space="preserve">Signals this produces for the security team</tspan></text>
  <text y="802" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="792" dy="11.049999999999999" xml:space="preserve">repeat offender        same member, same class, N times in a window</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">novel destination      a data class reaching a provider it has not before</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">credential attempt     secret_material blocked — always an incident, not a metric</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">exfil shape            tool output with a secret, then an outbound model call</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">prompt hygiene         oversized context, whole-repo pastes, prod connection strings</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">Each alert names the member, the agent, the policy, the reason code and the evidence,</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">and links to the one-click actions: revoke, restrict, require approval, open a case.</tspan></text>
</svg>
