<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="957" viewBox="0 0 1480 957">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">14 · Agent identity chain</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">Seven links, because six of them are the ones an investigation asks for and the seventh is the thing being authorized.</tspan></text>
  <rect x="40" y="150" width="340" height="54" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="162" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">human · the accountable root</tspan></text>
  <rect x="40" y="234" width="340" height="54" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="246" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">agent · the named workload</tspan></text>
  <rect x="40" y="318" width="340" height="54" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="330" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">agent version · what is approved</tspan></text>
  <rect x="40" y="402" width="340" height="54" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="414" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">agent instance · one running copy</tspan></text>
  <rect x="40" y="486" width="340" height="54" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="498" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">session · carries the taint</tspan></text>
  <rect x="40" y="570" width="340" height="54" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="582" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">task · one unit of work</tspan></text>
  <rect x="40" y="654" width="340" height="54" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="666" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">action · the authorization unit</tspan></text>
  <line x1="210" y1="204" x2="210" y2="234" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="210" y1="288" x2="210" y2="318" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="210" y1="372" x2="210" y2="402" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="210" y1="456" x2="210" y2="486" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="210" y1="540" x2="210" y2="570" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="210" y1="624" x2="210" y2="654" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="430" y="150" width="490" height="190" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="162" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="442" dy="13.6" xml:space="preserve">Who is responsible for an AI action</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="442" dy="11.049999999999999" xml:space="preserve">Every action resolves to exactly one human at the root.</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">`root_human_basis` records why that human is there:</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">interactive · scheduled_by · approved_by · owner_of_record.</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">A job that fires at 03:00 is attributed to its owner, and the</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">evidence says owner_of_record rather than implying that</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">somebody was at a keyboard. A service identity may never</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">be the root of a chain.</tspan></text>
  <rect x="430" y="370" width="490" height="160" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="382" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="442" dy="13.6" xml:space="preserve">What gets approved is the version</tspan></text>
  <text y="412" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="442" dy="11.049999999999999" xml:space="preserve">An agent is a name. An agent version is a composition</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">digest: system prompt, tool set, MCP snapshot, model,</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">memory scopes. Approval binds to the digest.</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">A changed digest is a new version, and it is unapproved</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">until a human approves it.</tspan></text>
  <rect x="430" y="560" width="490" height="170" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="572" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="442" dy="13.6" xml:space="preserve">The instance is what you revoke</tspan></text>
  <text y="602" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="442" dy="11.049999999999999" xml:space="preserve">One running copy: this laptop, this CI job, this container.</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">It registers before it may act, and it carries the grade of</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">enforcement actually available to it — which is how a report</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">can say &quot;B here, D there&quot; instead of one average that is true</tspan><tspan x="442" dy="18.849999999999998" xml:space="preserve">nowhere. Revocation targets an instance, a session or a lease.</tspan></text>
  <rect x="950" y="150" width="490" height="190" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="962" dy="13.6" xml:space="preserve">The credential is the real control</tspan></text>
  <text y="192" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="962" dy="11.049999999999999" xml:space="preserve">The broker issues, per task: short-lived, audience-bound</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">(RFC 8707), sender-constrained (RFC 9449 / RFC 8705),</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">scoped to the least authority the task declared it needs.</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">This is the one control that survives a bypassed path.</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">A stolen lease is narrow, expiring and attributable.</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">It is also the direct answer to the reference incident,</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">whose root cause was a long-lived token found on disk.</tspan></text>
  <rect x="950" y="370" width="490" height="160" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="382" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="962" dy="13.6" xml:space="preserve">Taint travels with the session</tspan></text>
  <text y="412" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="962" dy="11.049999999999999" xml:space="preserve">A session that has ingested untrusted content is tainted.</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">Taint does not block. It reduces what the session may do:</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">grants carry max_taint, and a tainted session loses the</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">capabilities whose ceiling it has passed — usually the</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">destructive ones and the ones that reach the internet.</tspan></text>
  <rect x="950" y="560" width="490" height="170" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="572" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="962" dy="13.6" xml:space="preserve">What this model does not claim</tspan></text>
  <text y="602" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="962" dy="11.049999999999999" xml:space="preserve">It does not stop prompt injection. A 2026 formal result</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">argues perfect prevention is unachievable at the model</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">layer, and adaptive attacks beat deployed commercial</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">detectors well above 90% while those detectors report</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">near zero under static evaluation. What this model does</tspan><tspan x="962" dy="18.849999999999998" xml:space="preserve">is shrink the reach of a compromised session.</tspan></text>
  <rect x="40" y="790" width="1400" height="127" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="802" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">The one-line test for this document</tspan></text>
  <text y="829" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Pick any action in the ledger. You must be able to name the human, the agent version and its composition digest, the instance</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">and the machine it ran on, the session and whether it was tainted, the task and where it came from, the grant that permitted it,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">the credential lease it used, the policy version that decided it, and the enforcement grade of that decision. If any of those is</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">missing, the ledger is telemetry rather than evidence, and it will not survive an investigation.</tspan></text>
</svg>
