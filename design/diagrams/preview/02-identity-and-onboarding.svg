<svg xmlns="http://www.w3.org/2000/svg" width="1540" height="1086" viewBox="0 0 1540 1086">
  <defs>
    <marker id="head-1e1e1e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1e1e1e"/></marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">02 · Identity, login and onboarding</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">Authentication is a per-account configuration served by the API, never a build-time constant in the browser bundle.</tspan></text>
  <rect x="40" y="140" width="300" height="168" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="152" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Identity sources</tspan></text>
  <text y="182" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Entra ID / Okta (OIDC)</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Keycloak / PingFederate</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">SAML 2.0 IdP</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">LDAP / Active Directory bind</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Local accounts + TOTP (air-gap)</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Dev stub (never in production)</tspan></text>
  <rect x="400" y="140" width="320" height="149" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="152" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="412" dy="13.6" xml:space="preserve">Auth adapter (server side)</tspan></text>
  <text y="182" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="412" dy="11.049999999999999" xml:space="preserve">auth_providers row per account</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">JWKS cache · issuer + audience check</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">Claim map: subject, email, name,</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">groups, employee id, manager</tspan><tspan x="412" dy="18.849999999999998" xml:space="preserve">Domain → account discovery</tspan></text>
  <rect x="780" y="140" width="330" height="149" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="152" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="792" dy="13.6" xml:space="preserve">Identity resolver</tspan></text>
  <text y="182" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="792" dy="11.049999999999999" xml:space="preserve">1. issuer+subject → member_identities</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">2. else verified email → member</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">3. else onboarding mode decides</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">Never trusts client-supplied identity</tspan><tspan x="792" dy="18.849999999999998" xml:space="preserve">Emits one session bootstrap payload</tspan></text>
  <rect x="1170" y="140" width="330" height="130" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="152" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1182" dy="13.6" xml:space="preserve">Session bootstrap (one call)</tspan></text>
  <text y="182" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1182" dy="11.049999999999999" xml:space="preserve">member · account · org units</tspan><tspan x="1182" dy="18.849999999999998" xml:space="preserve">roles · permissions · visibility scopes</tspan><tspan x="1182" dy="18.849999999999998" xml:space="preserve">navigation manifest · feature flags</tspan><tspan x="1182" dy="18.849999999999998" xml:space="preserve">Shell renders once, from one response</tspan></text>
  <line x1="340" y1="224" x2="400" y2="214.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="720" y1="214.5" x2="780" y2="214.5" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="1110" y1="214.5" x2="1170" y2="205" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="420" width="1460" height="149" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="432" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Onboarding modes — chosen per account, not per build</tspan></text>
  <text y="462" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">SCIM 2.0 push          IdP creates, updates and deactivates members and group memberships. Authoritative. Preferred for SaaS and VPC.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Directory sync (pull)  Scheduled read of LDAP/AD or Graph groups. Distribution lists become org units. Preferred on-prem.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Just-in-time           First successful login provisions the member from verified claims. Requires a domain allowlist and a default org unit.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Invite only            An admin invites an address; the first matching login claims the invitation. Default when no directory is connected.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Bulk import            CSV or DL export for pilots. Rows are staged, previewed, then committed as invitations.</tspan></text>
  <rect x="40" y="640" width="460" height="168" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="652" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="52" dy="13.6" xml:space="preserve">Administrator bootstrap</tspan></text>
  <text y="682" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Exactly one path per deployment:</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">SaaS — signed provisioning token from onboarding</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">VPC / on-prem — installer-sealed bootstrap credential</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Air-gap — offline licence + sealed credential</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">First holder gets account_owner, single use,</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">consumed and audited. No implicit owner from login.</tspan></text>
  <rect x="540" y="640" width="470" height="168" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="652" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="552" dy="13.6" xml:space="preserve">Tables that own identity</tspan></text>
  <text y="682" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="552" dy="11.049999999999999" xml:space="preserve">accounts, auth_providers, provider_claim_maps</tspan><tspan x="552" dy="18.849999999999998" xml:space="preserve">org_units (+ org_unit_closure), org_unit_managers</tspan><tspan x="552" dy="18.849999999999998" xml:space="preserve">members, member_identities, member_org_units</tspan><tspan x="552" dy="18.849999999999998" xml:space="preserve">directory_groups, group_org_unit_rules</tspan><tspan x="552" dy="18.849999999999998" xml:space="preserve">roles, role_permissions, access_grants</tspan><tspan x="552" dy="18.849999999999998" xml:space="preserve">member_invitations, session_events</tspan></text>
  <rect x="1050" y="640" width="450" height="168" rx="10" fill="#f8f9fa" stroke="#1e1e1e" stroke-width="1.4"/>
  <text y="652" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="16"><tspan x="1062" dy="13.6" xml:space="preserve">Failure taxonomy the UI must show</tspan></text>
  <text y="682" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1062" dy="11.049999999999999" xml:space="preserve">401 expired      silent renew, then re-auth</tspan><tspan x="1062" dy="18.849999999999998" xml:space="preserve">401 unknown      &quot;not provisioned&quot; + request access</tspan><tspan x="1062" dy="18.849999999999998" xml:space="preserve">403 module        empty state naming the role needed</tspan><tspan x="1062" dy="18.849999999999998" xml:space="preserve">403 scope        &quot;outside your visibility&quot; + owner</tspan><tspan x="1062" dy="18.849999999999998" xml:space="preserve">409 pending      &quot;awaiting approval&quot;, with request id</tspan><tspan x="1062" dy="18.849999999999998" xml:space="preserve">5xx / offline     retry with the reason code visible</tspan></text>
  <line x1="770" y1="569" x2="270" y2="640" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <line x1="770" y1="569" x2="775" y2="640" stroke="#1e1e1e" stroke-width="1.4" marker-end="url(#head-1e1e1e)"/>
  <rect x="40" y="900" width="1460" height="146" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="912" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">Why the current console breaks — and what removes the class of bug</tspan></text>
  <text y="939" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Today the browser decides the auth mode from build-time VITE_OIDC_* variables, saves a session before onboarding has</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">succeeded, keeps it in sessionStorage, and then loads each screen through separate queries that can each fail with 403.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Any one of those failing paints &quot;unable to login&quot; or &quot;something went wrong&quot; with no reason. The fix is structural:</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">GET /v1/auth/config decides the mode, POST /v1/auth/session completes onboarding before a session is persisted, and</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">GET /v1/session/bootstrap returns identity, permissions and navigation together so a rendered shell is always consistent.</tspan></text>
</svg>
