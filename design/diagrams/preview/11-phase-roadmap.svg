  <rect width="100%" height="100%" fill="#ffffff"/>
  <text y="40" fill="#1e1e1e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="28"><tspan x="40" dy="23.8" xml:space="preserve">11 · Development sequence</tspan></text>
  <text y="78" fill="#495057" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="40" dy="11.9" xml:space="preserve">One active ledger-first program. The old P0–P9 prompts are historical and must not be executed.</tspan></text>
  <rect x="40" y="150" width="285" height="260" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="1.4"/>
  <text y="162" fill="#c92a2a" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">F0 · console contract</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Finish revision 0022</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Server-side auth session</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">One bootstrap + typed errors</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Gate: browser never exchanges</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">tokens; no reasonless error</tspan></text>
  <rect x="335" y="150" width="285" height="260" rx="10" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.4"/>
  <text y="162" fill="#5f3dc4" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="347" dy="12.75" xml:space="preserve">F1 · schema</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="347" dy="11.049999999999999" xml:space="preserve">0023 runtime identity</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">0024 agent_actions ledger</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">RLS + append-only + partitions</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">Gate: fresh/existing upgrade</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">and privacy invariants pass</tspan></text>
  <rect x="630" y="150" width="285" height="260" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="642" dy="12.75" xml:space="preserve">F2 · UI structure</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="642" dy="11.049999999999999" xml:space="preserve">One shell and nav source</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Reuse Observe + admin UI</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Ledger home empty states</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Gate: Observe works with</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">no project selected</tspan></text>
  <rect x="925" y="150" width="285" height="260" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="162" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="937" dy="12.75" xml:space="preserve">M1 · identity chain</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="937" dy="11.049999999999999" xml:space="preserve">Instance, agent session, task</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">Human root + delegation</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">Extend existing agent detail</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">Gate: every instance resolves</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">to one accountable human</tspan></text>
  <rect x="1220" y="150" width="285" height="260" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="162" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="1232" dy="12.75" xml:space="preserve">M3 · action ingest</tspan></text>
  <text y="190" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1232" dy="11.049999999999999" xml:space="preserve">Claude Code first</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Cursor before the demo</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">aap.action.v1, no payloads</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Gate: both clients query as</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">graded content-free actions</tspan></text>
  <rect x="40" y="470" width="285" height="260" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="482" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="52" dy="12.75" xml:space="preserve">M4 · discovery</tspan></text>
  <text y="510" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Read-only hooks</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Shadow agents</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Credential-shaped reads</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">Gate: AP-1 path detected</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">without blocking work</tspan></text>
  <rect x="335" y="470" width="285" height="260" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.4"/>
  <text y="482" fill="#1864ab" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="347" dy="12.75" xml:space="preserve">M2 · visibility</tspan></text>
  <text y="510" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="347" dy="11.049999999999999" xml:space="preserve">0025 org-unit closure</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">0026 grants diff guard</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">Server-driven navigation</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">Gate: sibling units cannot</tspan><tspan x="347" dy="18.849999999999998" xml:space="preserve">see each other's actions</tspan></text>
  <rect x="630" y="470" width="285" height="260" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="482" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="642" dy="12.75" xml:space="preserve">M5 · MVP console</tspan></text>
  <text y="510" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="642" dy="11.049999999999999" xml:space="preserve">Action list + reconstruction</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Coverage denominator A–E</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Session timeline + discovery</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">Gate: investigator rebuilds</tspan><tspan x="642" dy="18.849999999999998" xml:space="preserve">one action end to end</tspan></text>
  <rect x="925" y="470" width="285" height="260" rx="10" fill="#fff9db" stroke="#f08c00" stroke-width="1.4"/>
  <text y="482" fill="#e67700" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="937" dy="12.75" xml:space="preserve">V1 · enforce</tspan></text>
  <text y="510" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="937" dy="11.049999999999999" xml:space="preserve">Cedar simulation first</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">Grade-B hook veto</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">MCP capability + broker</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">Gate: narrow real prevention</tspan><tspan x="937" dy="18.849999999999998" xml:space="preserve">with honest grade</tspan></text>
  <rect x="1220" y="470" width="285" height="260" rx="10" fill="#e3fafc" stroke="#0c8599" stroke-width="1.4"/>
  <text y="482" fill="#0b7285" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="15"><tspan x="1232" dy="12.75" xml:space="preserve">P · package</tspan></text>
  <text y="510" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="1232" dy="11.049999999999999" xml:space="preserve">Customer data plane</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Self-hosted + air-gap profile</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Signed rollback-safe bundles</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">Gate: no payload leaves</tspan><tspan x="1232" dy="18.849999999999998" xml:space="preserve">customer boundary</tspan></text>
  <rect x="40" y="760" width="1420" height="127" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.4"/>
  <text y="772" fill="#2b8a3e" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="14"><tspan x="52" dy="11.9" xml:space="preserve">How to use this plan</tspan></text>
  <text y="799" fill="#343a40" font-family="Nunito, Segoe UI, Helvetica, sans-serif" font-size="13"><tspan x="52" dy="11.049999999999999" xml:space="preserve">Paste one active file from design/prompts/README.md into a fresh session. F1 and F2 may overlap only because F2 adds no tables.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">The critical validation is M3: if Claude Code and Cursor cannot map to one content-free event contract, stop and revise the</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">capability abstraction. Do not build a gateway, ClickHouse pipeline, DLP stack or cost system to make the MVP feel larger.</tspan><tspan x="52" dy="18.849999999999998" xml:space="preserve">A slice closes only when its gate is demonstrated and PROJECT_STATE.md records migrations as written versus actually applied.</tspan></text>
</svg>
