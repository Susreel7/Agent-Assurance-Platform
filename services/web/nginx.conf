server {
    listen 80;
    # Dual-stack on purpose. With IPv4 only, `localhost` inside the container resolves
    # to ::1 first and the connection is refused, so the container's own health check
    # failed while the site served fine through the published port.
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths fall through to the bundle, which routes them.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is served from this origin rather than called across origins on :8000.
    # Same-origin means no CORS preflight on every request, and no second hostname to
    # configure per environment — the console is built with VITE_API_BASE=/ and the
    # deployment decides what that resolves to.
    #
    # `resolver` plus a variable target is deliberate: without it nginx resolves
    # `api` once at startup and caches the address forever, so it fails permanently if
    # the API container is recreated with a new IP, which docker compose does routinely.
    location /v1/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Lets the console show whether the platform behind it is actually ready, and which
    # deployment mode it is in, without knowing the API's address.
    location = /readyz {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Hashed assets are immutable; index.html must never be cached or a deploy
    # leaves users on a stale bundle talking to a new API.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

# The pid path belongs in nginx's main context, not in here. This file is loaded from
# conf.d, which nginx includes inside `http`, so a `pid` directive at this level is a
# hard startup failure rather than a warning. It is passed on the command line in the
# Dockerfile instead, because the unprivileged user cannot write the default
# /var/run/nginx.pid.
