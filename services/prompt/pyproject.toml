[project]
name = "aap-prompt"
version = "0.1.0"
description = "Agent Assurance Prompt — artifact workspace, runtime fetch, playground"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=43.0",
    "redis>=5.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
azure = ["azure-identity>=1.19", "azure-keyvault-keys>=4.9"]
gcp = ["google-cloud-kms>=3.0"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
prompt-api = "prompt.entrypoints:run_api"
prompt-export-openapi = "prompt.entrypoints:export_openapi"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["prompt*"]

[tool.setuptools.package-data]
"prompt.migrations" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"prompt/domains/**/router.py" = ["B008"]
"prompt/api/deps.py" = ["B008"]
"prompt/auth/internal.py" = ["B008"]
"prompt/domains/runtime/router.py" = ["B008"]
"prompt/domains/runtime/internal_router.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["prompt"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
    "testcontainers",
    "boto3",
    "botocore.*",
    "azure.*",
    "google.*",
    "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests needing real Postgres or router (optional)",
]
