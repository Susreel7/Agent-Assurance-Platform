[project]
name = "aap-evaluate"
version = "0.1.0"
description = "Agent Assurance Evaluate — datasets, experiments, evaluators, online rules, annotation"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "cryptography>=43.0",
    "redis>=5.0",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
object-store = [
    "boto3>=1.35",
    "azure-storage-blob>=12.23",
    "azure-identity>=1.19",
    "google-cloud-storage>=2.18",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "testcontainers[postgres]>=4.8",
]

[project.scripts]
evaluate-api = "evaluate.entrypoints:run_api"
evaluate-worker = "evaluate.entrypoints:run_worker"
evaluate-export-openapi = "evaluate.entrypoints:export_openapi"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["evaluate*"]

[tool.setuptools.package-data]
"evaluate.migrations" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"evaluate/domains/**/router.py" = ["B008"]
"evaluate/api/deps.py" = ["B008"]
"evaluate/auth/internal.py" = ["B008"]
"evaluate/db/repository.py" = ["E501"]
"evaluate/domains/**" = ["E501"]
"evaluate/evaluators/engine.py" = ["E501"]
"evaluate/evaluators/python_sandbox.py" = ["E501"]
"evaluate/clients/router.py" = ["E501"]
"evaluate/config.py" = ["E501"]
"evaluate/log_safe.py" = ["E501"]
"evaluate/worker/runner.py" = ["E501"]
"evaluate/worker/online_eval.py" = ["E501"]
"tests/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["evaluate"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
    "testcontainers",
    "redis.*",
    "boto3",
    "botocore.*",
    "azure.*",
    "google.cloud.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["evaluate.evaluators.python_sandbox"]
disable_error_code = ["attr-defined"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests needing real Postgres (optional)",
]
