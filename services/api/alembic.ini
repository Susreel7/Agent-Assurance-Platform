[alembic]
script_location = alembic
prepend_sys_path = .

# path_separator supersedes version_path_separator and also governs prepend_sys_path.
# Without it Alembic falls back to splitting on spaces, commas *and colons*, which on
# Windows would split a path at its drive letter. It warns when absent, and this project
# turns DeprecationWarning into an error.
path_separator = os

# No sqlalchemy.url here on purpose. The URL comes from app.config so that a BYOC
# install pointing at managed Postgres needs no change to this file.

[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
