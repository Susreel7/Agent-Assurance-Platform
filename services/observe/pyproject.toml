[project]
name = "aap-observe"
version = "0.1.0"
description = "Agent Assurance Observe — OTLP ingest, normalization, trace query"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "opentelemetry-proto>=1.27",
    "protobuf>=5.28",
    "cryptography>=43.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.35"]
azure = ["azure-storage-blob>=12.23"]
gcp = ["google-cloud-storage>=2.18"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-redis",
]

[project.scripts]
observe-ingest = "observe.entrypoints:run_ingest"
observe-worker = "observe.entrypoints:run_worker"
observe-query = "observe.entrypoints:run_query"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["observe*"]

[tool.setuptools.package-data]
"observe.clickhouse" = ["*.sql", "migrations/*.sql"]
"observe.migrations" = ["*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]

[tool.ruff.lint.per-file-ignores]
"observe/query/app.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["observe"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["opentelemetry.*", "google.*", "boto3", "botocore.*", "azure.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests needing real Postgres/ClickHouse/Redis (optional)",
]
